name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o SBhStudio_ready.zip -d temp_extract

          GRADLEW_PATH=$(find temp_extract -name "gradlew" -type f | head -n 1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "Erreur : gradlew introuvable dans le ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")

          cp -r "$PROJECT_DIR"/. .

          chmod +x gradlew

          rm -rf temp_extract

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check Java and Gradle
        run: |
          java -version
          ./gradlew --version

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
