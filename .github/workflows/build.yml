name: Build SBh Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. RÉCUPÉRER LE DÉPÔT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. TROUVER ET EXTRAIRE LE ZIP SBh STUDIO
      # =========================================================
      - name: Extraire SBh Studio
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " EXTRACTION SBh STUDIO"
          echo "=========================================="

          ZIP="$(find . -type f -iname 'SBhStudio*.zip' | sort | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "❌ Aucun ZIP SBh Studio trouvé."
            echo ""
            echo "Fichiers présents :"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "✅ ZIP trouvé : $ZIP"

          rm -rf sbh
          mkdir -p sbh

          unzip -q "$ZIP" -d sbh

          echo ""
          echo "Recherche de gradlew :"
          find sbh -type f -name "gradlew" -print

      # =========================================================
      # 3. DÉTECTER LE VRAI DOSSIER DU PROJET
      # =========================================================
      - name: Détecter le projet Android
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$(dirname "$(find "$GITHUB_WORKSPACE/sbh" \
            -type f \
            -name 'gradlew' \
            -print -quit)")"

          if [ -z "$ROOT" ] || [ ! -f "$ROOT/gradlew" ]; then
            echo "❌ Projet Android introuvable."

            echo ""
            echo "Structure trouvée :"
            find "$GITHUB_WORKSPACE/sbh" -maxdepth 6 -type f | sort

            exit 1
          fi

          echo "=========================================="
          echo " PROJET ANDROID DÉTECTÉ"
          echo "=========================================="

          echo "$ROOT"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Contenu :"
          ls -la "$ROOT"

      # =========================================================
      # 4. JAVA 17
      # =========================================================
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 5. PRÉPARER ANDROID SDK
      #
      # IMPORTANT :
      # PAS de android-actions/setup-android@v3
      # qui provoquait l'erreur sdkmanager.
      # =========================================================
      - name: Préparer Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " ANDROID SDK"
          echo "=========================================="

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "❌ Android SDK introuvable."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print \
            | sort -V \
            | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "❌ sdkmanager introuvable."
            exit 1
          fi

          echo "sdkmanager : $SDKMANAGER"

          chmod +x "$SDKMANAGER"

          echo ""
          echo "Version SDK manager :"
          "$SDKMANAGER" --version || true

          echo ""
          echo "Installation des composants nécessaires..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "✅ Android SDK préparé."

      # =========================================================
      # 6. CORRIGER LE PARSING VERSION.JSON
      # =========================================================
      - name: Corriger build.gradle.kts
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " CORRECTION KOTLIN"
          echo "=========================================="

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")

          if not path.exists():
              raise SystemExit("❌ app/build.gradle.kts introuvable")

          text = path.read_text()

          lines = text.splitlines()
          result = []

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("val sbhVersionCode = Regex("):
                  result.append(
                      'val sbhVersionCode = Regex("""["]versionCode["]\\s*:\\s*(\\d+)""")'
                  )
                  continue

              if stripped.startswith("val sbhVersionName = Regex("):
                  result.append(
                      'val sbhVersionName = Regex("""["]versionName["]\\s*:\\s*["]([^"]+)["]""")'
                  )
                  continue

              result.append(line)

          path.write_text("\n".join(result) + "\n")

          print("✅ build.gradle.kts corrigé")
          PY

          echo ""
          echo "Vérification :"
          nl -ba app/build.gradle.kts | sed -n '1,50p'

      # =========================================================
      # 7. VERSION SBh STUDIO
      # =========================================================
      - name: Lire version.json
        id: version
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " VERSION SBh STUDIO"
          echo "=========================================="

          if [ ! -f version.json ]; then
            echo "❌ version.json introuvable."
            exit 1
          fi

          cat version.json

          VERSION="$(python3 -c '
          import json
          with open("version.json", encoding="utf-8") as f:
              print(json.load(f)["versionName"])
          ')"

          CODE="$(python3 -c '
          import json
          with open("version.json", encoding="utf-8") as f:
              print(json.load(f)["versionCode"])
          ')"

          echo ""
          echo "Version : $VERSION"
          echo "Code    : $CODE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 8. PRÉPARER GRADLE
      # =========================================================
      - name: Préparer Gradle
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "=========================================="
          echo " GRADLE"
          echo "=========================================="

          ./gradlew --version

      # =========================================================
      # 9. VALIDATION SBh
      # =========================================================
      - name: Validation SBh Studio
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " VALIDATION SBh STUDIO"
          echo "=========================================="

          if [ -f tools/validate_sbh.py ]; then
            python3 tools/validate_sbh.py
          else
            echo "⚠️ validate_sbh.py absent."
            echo "La compilation continue."
          fi

      # =========================================================
      # 10. NETTOYAGE
      # =========================================================
      - name: Nettoyer
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " NETTOYAGE"
          echo "=========================================="

          ./gradlew clean --no-daemon

      # =========================================================
      # 11. COMPILATION APK
      # =========================================================
      - name: Compiler APK Debug
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " COMPILATION SBh STUDIO"
          echo "=========================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 12. VÉRIFIER APK
      # =========================================================
      - name: Vérifier APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " APK"
          echo "=========================================="

          APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "❌ Aucun APK généré."

            echo ""
            echo "Contenu de build :"
            find app/build -maxdepth 6 -type f | sort || true

            exit 1
          fi

          echo "✅ APK trouvé :"
          echo "$APK"

          echo ""
          echo "Taille :"
          ls -lh "$APK"

          echo ""
          echo "SHA256 :"
          sha256sum "$APK"

      # =========================================================
      # 13. PRÉPARER APK FINAL
      # =========================================================
      - name: Préparer APK final
        id: apk
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print -quit)"

          FINAL="release/SBhStudio-V${{ steps.version.outputs.version }}-debug.apk"

          cp "$APK" "$FINAL"

          echo "=========================================="
          echo " APK FINAL"
          echo "=========================================="

          ls -lh "$FINAL"

          echo "path=$FINAL" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 14. PUBLIER L'APK
      # =========================================================
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: SBh-Studio-V${{ steps.version.outputs.version }}-APK
          path: ${{ steps.project.outputs.root }}/release/SBhStudio-V${{ steps.version.outputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 15. RAPPORT FINAL
      # =========================================================
      - name: Rapport final
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " SBh STUDIO - BUILD TERMINÉ"
          echo "=========================================="
          echo ""
          echo "Version : ${{ steps.version.outputs.version }}"
          echo "Code    : ${{ steps.version.outputs.code }}"
          echo ""
          echo "✅ Projet détecté"
          echo "✅ Java 17"
          echo "✅ Android SDK"
          echo "✅ Correction Kotlin"
          echo "✅ Validation"
          echo "✅ Gradle"
          echo "✅ APK généré"
          echo "✅ APK publié dans Artifacts"
          echo ""
          echo "Nom :"
          echo "SBhStudio-V${{ steps.version.outputs.version }}-debug.apk"
          echo ""
          echo "=========================================="
