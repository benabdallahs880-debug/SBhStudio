name: Build SBh Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. TROUVER ET EXTRAIRE LE ZIP SBh STUDIO
      # =========================================================
      - name: Extraire SBh Studio
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " EXTRACTION SBh STUDIO"
          echo "=========================================="

          ZIP="$(find . -type f -iname 'SBhStudio*.zip' | sort | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "❌ Aucun ZIP SBhStudio*.zip trouvé."
            echo ""
            echo "Fichiers du dépôt :"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "✅ ZIP trouvé : $ZIP"

          rm -rf sbh
          mkdir -p sbh

          unzip -q "$ZIP" -d sbh

          echo ""
          echo "Recherche de gradlew :"
          find sbh -type f -name "gradlew" -print

      # =========================================================
      # 3. DÉTECTER LE PROJET ANDROID
      # =========================================================
      - name: Détecter le projet Android
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$(dirname "$(find "$GITHUB_WORKSPACE/sbh" \
            -type f \
            -name "gradlew" \
            -print -quit)")"

          if [ -z "$ROOT" ] || [ ! -f "$ROOT/gradlew" ]; then
            echo "❌ gradlew introuvable."

            echo ""
            echo "Structure extraite :"
            find "$GITHUB_WORKSPACE/sbh" \
              -maxdepth 7 \
              -type f \
              | sort

            exit 1
          fi

          echo "=========================================="
          echo " PROJET ANDROID DÉTECTÉ"
          echo "=========================================="

          echo "$ROOT"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Contenu :"
          ls -la "$ROOT"

      # =========================================================
      # 4. JAVA 17
      # =========================================================
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 5. ANDROID SDK
      # =========================================================
      - name: Préparer Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " ANDROID SDK"
          echo "=========================================="

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "❌ Android SDK introuvable."
            exit 1
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "❌ sdkmanager introuvable ou non exécutable."
            echo "$SDKMANAGER"
            exit 1
          fi

          echo ""
          echo "sdkmanager : $SDKMANAGER"

          echo ""
          echo "Version SDK manager :"
          "$SDKMANAGER" --version

          echo ""
          echo "Licences Android..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo ""
          echo "Installation des composants..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "✅ Android SDK prêt."

      # =========================================================
      # 6. NETTOYER COMPLÈTEMENT LE BLOC DE VERSION
      #
      # IMPORTANT :
      # On supprime les anciennes déclarations avant d'en créer
      # de nouvelles. Cela évite les doublons sbhVersionText.
      # =========================================================
      - name: Corriger build.gradle.kts
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " CORRECTION build.gradle.kts"
          echo "=========================================="

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")

          if not path.exists():
              raise SystemExit(
                  "❌ app/build.gradle.kts introuvable"
              )

          text = path.read_text(encoding="utf-8")

          # -----------------------------------------------------
          # Trouver le bloc android {
          # -----------------------------------------------------

          match = re.search(
              r'(?m)^android\s*\{',
              text
          )

          if not match:
              raise SystemExit(
                  "❌ Bloc android { introuvable."
              )

          android_start = match.start()

          before = text[:android_start]
          android_and_after = text[android_start:]

          # -----------------------------------------------------
          # Supprimer toutes les anciennes déclarations liées
          # à SBh version.
          #
          # On retire :
          #   val sbhVersionText = ...
          #   val sbhVersionCode = ...
          #   val sbhVersionName = ...
          #
          # ainsi que les continuations Kotlin associées.
          # -----------------------------------------------------

          patterns = [

              # sbhVersionText
              r'(?ms)^[ \t]*val\s+sbhVersionText\s*=.*?(?=^[ \t]*val\s+|\Z)',

              # sbhVersionCode
              r'(?ms)^[ \t]*val\s+sbhVersionCode\s*=.*?(?=^[ \t]*val\s+|\Z)',

              # sbhVersionName
              r'(?ms)^[ \t]*val\s+sbhVersionName\s*=.*?(?=^[ \t]*val\s+|\Z)',
          ]

          for pattern in patterns:
              before = re.sub(
                  pattern,
                  '',
                  before
              )

          # -----------------------------------------------------
          # Nettoyage supplémentaire des éventuelles lignes
          # orphelines provenant des anciennes corrections.
          # -----------------------------------------------------

          before = re.sub(
              r'(?m)^[ \t]*\.find\(sbhVersionText\).*?\n?',
              '',
              before
          )

          before = re.sub(
              r'(?m)^[ \t]*\?\.groupValues.*?\n?',
              '',
              before
          )

          before = re.sub(
              r'(?m)^[ \t]*\?\.get\(1\).*?\n?',
              '',
              before
          )

          before = re.sub(
              r'(?m)^[ \t]*\?\.toInt\(\).*?\n?',
              '',
              before
          )

          before = re.sub(
              r'(?m)^[ \t]*\?:\s*error\(.*?\)\s*\n?',
              '',
              before
          )

          # -----------------------------------------------------
          # NOUVEAU BLOC UNIQUE
          # -----------------------------------------------------

          version_block = '''
          val sbhVersionText = file("../version.json").readText()

          val sbhVersionCode: Int =
              Regex("""["]versionCode["]\\s*:\\s*(\\d+)""")
                  .find(sbhVersionText)
                  ?.groupValues
                  ?.get(1)
                  ?.toInt()
                  ?: error("version.json: versionCode manquant")

          val sbhVersionName: String =
              Regex("""["]versionName["]\\s*:\\s*["]([^"]+)["]""")
                  .find(sbhVersionText)
                  ?.groupValues
                  ?.get(1)
                  ?: error("version.json: versionName manquant")
          '''

          # -----------------------------------------------------
          # Reconstruire le fichier
          # -----------------------------------------------------

          fixed = (
              before.rstrip()
              + "\n\n"
              + version_block.strip()
              + "\n\n"
              + android_and_after.lstrip()
          )

          path.write_text(
              fixed,
              encoding="utf-8"
          )

          print("✅ Bloc de version reconstruit.")
          PY

          echo ""
          echo "=========================================="
          echo " CONTENU build.gradle.kts"
          echo "=========================================="

          nl -ba app/build.gradle.kts | sed -n '1,90p'

          echo ""
          echo "=========================================="
          echo " DÉTECTION DES DOUBLONS"
          echo "=========================================="

          TEXT_COUNT="$(grep -c 'val sbhVersionText' app/build.gradle.kts || true)"
          CODE_COUNT="$(grep -c 'val sbhVersionCode' app/build.gradle.kts || true)"
          NAME_COUNT="$(grep -c 'val sbhVersionName' app/build.gradle.kts || true)"

          echo "sbhVersionText : $TEXT_COUNT"
          echo "sbhVersionCode : $CODE_COUNT"
          echo "sbhVersionName : $NAME_COUNT"

          if [ "$TEXT_COUNT" -ne 1 ]; then
            echo "❌ sbhVersionText n'est pas unique."
            exit 1
          fi

          if [ "$CODE_COUNT" -ne 1 ]; then
            echo "❌ sbhVersionCode n'est pas unique."
            exit 1
          fi

          if [ "$NAME_COUNT" -ne 1 ]; then
            echo "❌ sbhVersionName n'est pas unique."
            exit 1
          fi

          echo ""
          echo "✅ Aucun doublon détecté."

      # =========================================================
      # 7. VÉRIFIER version.json
      # =========================================================
      - name: Vérifier version.json
        id: version
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " VERSION SBh STUDIO"
          echo "=========================================="

          if [ ! -f version.json ]; then
            echo "❌ version.json introuvable."
            exit 1
          fi

          cat version.json

          VERSION="$(
            python3 -c '
          import json
          with open("version.json", encoding="utf-8") as f:
              data = json.load(f)
          print(data["versionName"])
          '
          )"

          CODE="$(
            python3 -c '
          import json
          with open("version.json", encoding="utf-8") as f:
              data = json.load(f)
          print(data["versionCode"])
          '
          )"

          echo ""
          echo "Version : $VERSION"
          echo "Code    : $CODE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 8. PRÉPARER GRADLE
      # =========================================================
      - name: Préparer Gradle
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " GRADLE"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew --version

      # =========================================================
      # 9. VALIDATION SBh STUDIO
      # =========================================================
      - name: Validation SBh Studio
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " VALIDATION SBh STUDIO"
          echo "=========================================="

          if [ -f tools/validate_sbh.py ]; then
            python3 tools/validate_sbh.py
          else
            echo "⚠️ tools/validate_sbh.py absent."
            echo "La compilation continue."
          fi

      # =========================================================
      # 10. NETTOYAGE
      # =========================================================
      - name: Nettoyer le projet
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " NETTOYAGE"
          echo "=========================================="

          ./gradlew clean --no-daemon

      # =========================================================
      # 11. COMPILATION APK
      # =========================================================
      - name: Compiler APK Debug
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " COMPILATION SBh STUDIO"
          echo "=========================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 12. VÉRIFIER APK
      # =========================================================
      - name: Vérifier APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " APK"
          echo "=========================================="

          APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "❌ Aucun APK généré."

            find app/build \
              -maxdepth 7 \
              -type f \
              | sort || true

            exit 1
          fi

          echo "✅ APK trouvé : $APK"

          echo ""
          echo "Taille :"
          ls -lh "$APK"

          echo ""
          echo "SHA256 :"
          sha256sum "$APK"

      # =========================================================
      # 13. PRÉPARER APK FINAL
      # =========================================================
      - name: Préparer APK final
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "❌ APK introuvable."
            exit 1
          fi

          FINAL="release/SBhStudio-V${{ steps.version.outputs.version }}-debug.apk"

          cp "$APK" "$FINAL"

          echo "=========================================="
          echo " APK FINAL"
          echo "=========================================="

          ls -lh "$FINAL"

      # =========================================================
      # 14. PUBLIER L'APK
      # =========================================================
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: SBh-Studio-V${{ steps.version.outputs.version }}-APK
          path: ${{ steps.project.outputs.root }}/release/SBhStudio-V${{ steps.version.outputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 15. RAPPORT FINAL
      # =========================================================
      - name: Rapport final
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " SBh STUDIO - BUILD TERMINÉ"
          echo "=========================================="
          echo ""
          echo "Version : ${{ steps.version.outputs.version }}"
          echo "Code    : ${{ steps.version.outputs.code }}"
          echo ""
          echo "✅ ZIP extrait"
          echo "✅ Projet Android détecté"
          echo "✅ Java 17"
          echo "✅ Android SDK"
          echo "✅ Bloc version nettoyé"
          echo "✅ Aucun doublon"
          echo "✅ Validation"
          echo "✅ Gradle"
          echo "✅ APK compilé"
          echo "✅ APK publié"
          echo ""
          echo "SBhStudio-V${{ steps.version.outputs.version }}-debug.apk"
          echo ""
          echo "=========================================="
