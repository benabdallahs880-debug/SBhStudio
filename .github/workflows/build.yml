name: SBH Studio V1.4

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbh-studio-v1.4-${{ github.ref }}
  cancel-in-progress: true

env:
  SBH_ARCHIVE: SBhStudio_v1.4_sbh_world_agw_integration.zip

jobs:

  # ============================================================
  # INSPECTION DU PROJET
  # ============================================================

  inspect:
    name: Inspect SBH Studio V1.4
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Vérifier l'archive V1.4
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "       SBH STUDIO V1.4 - ARCHIVE CHECK"
          echo "=============================================="

          if [ ! -f "$SBH_ARCHIVE" ]; then
            echo "ERREUR : archive introuvable :"
            echo "$SBH_ARCHIVE"
            echo ""
            echo "Fichiers disponibles :"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Archive trouvée :"
          echo "$SBH_ARCHIVE"


      - name: Extraire SBH Studio V1.4
        shell: bash
        run: |
          set -euo pipefail

          rm -rf sbhstudio-src

          mkdir -p sbhstudio-src

          unzip -q "$SBH_ARCHIVE" -d sbhstudio-src

          echo "=============================================="
          echo "       CONTENU DE L'ARCHIVE"
          echo "=============================================="

          find sbhstudio-src -maxdepth 5 -type f | sort | head -500


      - name: Détecter le projet Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "       DETECTION DU PROJET ANDROID"
          echo "=============================================="

          PROJECT_DIR=""

          PROJECT_DIR=$(find sbhstudio-src \
            -type f \
            -name "gradlew" \
            -print \
            -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find sbhstudio-src \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then

            echo "=============================================="
            echo "ERREUR : PROJET GRADLE NON TROUVE"
            echo "=============================================="

            echo ""
            echo "Gradle détecté :"

            find sbhstudio-src \
              -type f \
              \( \
                -name "*.gradle" \
                -o \
                -name "*.gradle.kts" \
                -o \
                -name "gradlew" \
                -o \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print || true

            exit 1
          fi

          echo "Projet Android détecté :"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$PROJECT_DIR/gradlew"


      - name: Vérifier la structure Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "       VERIFICATION GRADLE"
          echo "=============================================="

          test -f "$PROJECT_DIR/gradlew"

          test -f \
            "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERREUR : settings.gradle introuvable."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERREUR : build.gradle introuvable."
            exit 1
          fi

          echo "Structure Gradle OK."


      - name: Vérifier la version Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew --version


      - name: Rechercher AGW World Core
        shell: bash
        run: |
          echo "=============================================="
          echo "       AGW WORLD CORE"
          echo "=============================================="

          find sbhstudio-src \
            -type f \
            \( \
              -iname "agw_world_core.json" \
              -o \
              -iname "*agw*world*core*.json" \
              -o \
              -iname "*worldcore*.json" \
            \) \
            -print || true


  # ============================================================
  # BUILD ANDROID
  # ============================================================

  build:
    name: Build SBH Studio V1.4
    runs-on: ubuntu-latest

    needs:
      - inspect

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Vérifier l'archive
        shell: bash
        run: |
          set -euo pipefail

          test -f "$SBH_ARCHIVE"


      - name: Extraire SBH Studio V1.4
        shell: bash
        run: |
          set -euo pipefail

          rm -rf sbhstudio-src

          mkdir -p sbhstudio-src

          unzip -q "$SBH_ARCHIVE" -d sbhstudio-src


      - name: Détecter le projet Gradle
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=$(find sbhstudio-src \
            -type f \
            -name "gradlew" \
            -print \
            -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then

            PROJECT_DIR=$(find sbhstudio-src \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              -quit | xargs -r dirname)

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : impossible de détecter le projet Gradle."
            exit 1
          fi

          echo "Projet : $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$PROJECT_DIR/gradlew"


      # ========================================================
      # JAVA
      # ========================================================

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ========================================================
      # ANDROID SDK
      # ========================================================

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3


      - name: Installer les composants Android
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "       ANDROID SDK"
          echo "=============================================="

          sdkmanager "platform-tools"

          sdkmanager "platforms;android-34"

          sdkmanager "platforms;android-35"

          sdkmanager "build-tools;34.0.0"

          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true


      # ========================================================
      # GRADLE
      # ========================================================

      - name: Vérifier Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "       GRADLE"
          echo "=============================================="

          ./gradlew --version


      # ========================================================
      # AGW WORLD CORE
      # ========================================================

      - name: Vérifier AGW World Core
        shell: bash
        run: |
          echo "=============================================="
          echo "       AGW WORLD CORE CHECK"
          echo "=============================================="

          find "$PROJECT_DIR" \
            -type f \
            \( \
              -iname "agw_world_core.json" \
              -o \
              -iname "*agw*world*core*.json" \
              -o \
              -iname "*worldcore*.json" \
            \) \
            -print || true


      # ========================================================
      # VALIDATION JSON
      # ========================================================

      - name: Valider les fichiers JSON
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PY'

          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])

          files = list(root.rglob("*.json"))

          errors = 0

          print("==============================================")
          print("       VALIDATION JSON")
          print("==============================================")

          print(f"JSON trouvés : {len(files)}")

          for path in files:

              try:

                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as f:

                      json.load(f)

              except Exception as exc:

                  print("")
                  print("JSON INVALID")
                  print(path)
                  print(exc)

                  errors += 1

          print("")
          print(f"JSON analysés : {len(files)}")

          if errors > 0:

              print(
                  f"Nombre d'erreurs JSON : {errors}"
              )

              sys.exit(1)

          print("Tous les fichiers JSON sont valides.")

          PY


      # ========================================================
      # CLEAN
      # ========================================================

      - name: Nettoyer le projet
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "       GRADLE CLEAN"
          echo "=============================================="

          ./gradlew clean \
            --stacktrace \
            --no-daemon


      # ========================================================
      # BUILD DEBUG
      # ========================================================

      - name: Compiler SBH Studio V1.4
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "       SBH STUDIO V1.4 BUILD"
          echo "=============================================="

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon


      # ========================================================
      # TESTS
      # ========================================================

      - name: Lancer les tests Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "       TESTS"
          echo "=============================================="

          ./gradlew test \
            --stacktrace \
            --no-daemon \
            --continue


      # ========================================================
      # RECHERCHE APK
      # ========================================================

      - name: Rechercher l'APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "       APK PRODUITS"
          echo "=============================================="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*debug*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then

            APK=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print \
              -quit)

          fi

          if [ -z "$APK" ]; then

            echo "=============================================="
            echo "ERREUR : AUCUN APK GENERE"
            echo "=============================================="

            exit 1

          fi

          echo "APK trouvé :"
          echo "$APK"

          mkdir -p artifacts

          cp "$APK" \
            "artifacts/SBH_Studio_V1.4_debug.apk"

          echo ""
          echo "APK préparé :"

          ls -lh \
            "artifacts/SBH_Studio_V1.4_debug.apk"


      # ========================================================
      # UPLOAD APK
      # ========================================================

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: SBH-Studio-V1.4-Android
          path: artifacts/SBH_Studio_V1.4_debug.apk
          if-no-files-found: error


      # ========================================================
      # RAPPORT FINAL
      # ========================================================

      - name: Rapport final
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "       SBH STUDIO V1.4"
          echo "       BUILD TERMINE"
          echo "=============================================="
          echo ""
          echo "Archive :"
          echo "$SBH_ARCHIVE"
          echo ""
          echo "Integration :"
          echo "SBH Studio"
          echo "SBH World"
          echo "AGW World Core"
          echo ""
          echo "Build : DEBUG"
          echo ""
          echo "Artifact :"
          echo "SBH-Studio-V1.4-Android"
          echo ""
          echo "APK :"
          echo "SBH_Studio_V1.4_debug.apk"
          echo ""
          echo "=============================================="
