name: SBH World

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget openjdk-17-jdk

      - name: Vérifier les fichiers du dépôt
        run: |
          echo "===== RACINE DU DEPOT ====="
          ls -lah

          if [ ! -f "SBH_World_Prototype_Etape2_fixed_repaired.zip" ]; then
            echo "ERREUR : SBH_World_Prototype_Etape2_fixed_repaired.zip introuvable."
            exit 1
          fi

      - name: Extraire le projet SBH
        run: |
          rm -rf sbh_world
          mkdir -p sbh_world

          unzip -o \
            "SBH_World_Prototype_Etape2_fixed_repaired.zip" \
            -d sbh_world

      - name: Trouver project.godot
        run: |
          PROJECT_FILE=$(find sbh_world \
            -name "project.godot" \
            -type f \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERREUR : project.godot introuvable."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Projet trouvé : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Afficher la structure du projet
        run: |
          echo "===== STRUCTURE SBH WORLD ====="
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

      - name: Installer Godot 4.5
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip

          sudo mv \
            Godot_v4.5-stable_linux.x86_64 \
            /usr/local/bin/godot

          sudo chmod +x /usr/local/bin/godot

      - name: Vérifier Godot
        run: |
          echo "===== GODOT ====="
          godot --version

      - name: Installer les templates Godot 4.5
        run: |
          echo "===== EXPORT TEMPLATES ====="

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz" \
            -O export_templates.tpz

          rm -rf templates
          mkdir -p templates

          unzip -q export_templates.tpz -d templates

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/4.5.stable"

          cp -r \
            templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.5.stable/"

          echo "Templates installés."

      - name: Vérifier les templates Android
        run: |
          echo "===== VERIFICATION TEMPLATES ====="

          ls -lah \
            "$HOME/.local/share/godot/export_templates/4.5.stable/"

          if [ ! -f \
            "$HOME/.local/share/godot/export_templates/4.5.stable/android_debug.apk" \
          ]; then
            echo "ERREUR : android_debug.apk introuvable."
            exit 1
          fi

          if [ ! -f \
            "$HOME/.local/share/godot/export_templates/4.5.stable/android_release.apk" \
          ]; then
            echo "ERREUR : android_release.apk introuvable."
            exit 1
          fi

          echo "Templates Android OK."

      - name: Vérifier export_presets.cfg
        run: |
          echo "===== EXPORT PRESETS ====="

          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            echo "ERREUR : export_presets.cfg introuvable."
            exit 1
          fi

          cat "$PROJECT_DIR/export_presets.cfg"

      - name: Diagnostic Godot du projet
        run: |
          echo "===== INITIALISATION GODOT ====="

          godot \
            --headless \
            --path "$PROJECT_DIR" \
            --editor \
            --quit

      - name: Vérifier la configuration Android
        run: |
          echo "===== DIAGNOSTIC ANDROID ====="

          echo "Java :"
          java -version

          echo
          echo "JAVA_HOME :"
          echo "${JAVA_HOME:-non défini}"

          echo
          echo "Godot :"
          godot --version

          echo
          echo "Preset Android détecté dans export_presets.cfg :"

          grep -n \
            -A 80 \
            'name="Android"' \
            "$PROJECT_DIR/export_presets.cfg" || true

      - name: Préparer le dossier de build
        run: |
          rm -rf "$PROJECT_DIR/build"
          mkdir -p "$PROJECT_DIR/build"

      - name: Export APK Android avec diagnostic
        run: |
          echo "===== EXPORT APK ====="

          set -o pipefail

          godot \
            --headless \
            --verbose \
            --path "$PROJECT_DIR" \
            --export-debug \
            "Android" \
            "$PROJECT_DIR/build/SBH-World.apk" \
            2>&1 | tee android-export.log

      - name: Afficher le diagnostic en cas d'échec
        if: failure()
        run: |
          echo "===== DIAGNOSTIC EXPORT ANDROID ====="

          if [ -f android-export.log ]; then
            cat android-export.log
          else
            echo "Aucun journal android-export.log disponible."
          fi

      - name: Vérifier l'APK
        run: |
          echo "===== VERIFICATION APK ====="

          if [ ! -f "$PROJECT_DIR/build/SBH-World.apk" ]; then
            echo "ERREUR : APK non généré."
            exit 1
          fi

          ls -lh "$PROJECT_DIR/build/SBH-World.apk"

          echo "APK SBH World généré avec succès."

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: SBH-World-APK
          path: ${{ env.PROJECT_DIR }}/build/SBH-World.apk
          if-no-files-found: error
          retention-days: 7
