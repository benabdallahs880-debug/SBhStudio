name: Build SBh Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraire SBh Studio
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'SBhStudio*.zip' | sort | head -n 1)
          test -n "$ZIP"
          echo "ZIP trouvé : $ZIP"
          unzip -q "$ZIP" -d sbh
          find sbh -name gradlew -type f | head

      - name: Trouver le projet
        id: project
        run: |
          ROOT=$(dirname "$(find "$GITHUB_WORKSPACE/sbh" -name gradlew -type f | head -n 1)")
          test -n "$ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Projet trouvé : $ROOT"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Préparer Gradle
        working-directory: ${{ steps.project.outputs.root }}
        run: chmod +x gradlew

      - name: Vérifier la version
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          echo "=== Version ==="
          cat version.json
          echo "=============="

      - name: Validation SBh
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          if [ -f tools/validate_sbh.py ]; then
            python3 tools/validate_sbh.py
          else
            echo "Validateur absent, compilation maintenue."
          fi

      - name: Compiler APK Debug
        working-directory: ${{ steps.project.outputs.root }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Vérifier APK
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          echo "=== APK généré ==="
          find app/build/outputs/apk/debug -type f -name "*.apk" -print
          test -n "$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

      - name: Récupérer APK
        uses: actions/upload-artifact@v4
        with:
          name: SBh-Studio-V1.4.0-debug
          path: ${{ steps.project.outputs.root }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
