name: Build APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publier une GitHub Release avec l'APK signé"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sbh-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # SBH STUDIO V1.4.0
  # ANALYSE + BUILD DEBUG
  # ============================================================

  analyze-and-build:
    name: SBh Studio V1.4.0 - Analyse + Build Debug
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Récupération du dépôt
      # ----------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Recherche du projet Android
      # ----------------------------------------------------------

      - name: Préparer le projet SBh Studio V1.4
        id: project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " SBh Studio V1.4.0"
          echo " Préparation du projet"
          echo "=========================================="

          echo ""
          echo "Répertoire courant :"
          pwd

          echo ""
          echo "Contenu initial :"
          ls -la

          PROJECT_ROOT=""

          # ======================================================
          # CAS 1
          # Projet Android directement à la racine
          # ======================================================

          if [ -f "gradlew" ] &&
             [ -f "settings.gradle.kts" ] &&
             [ -d "app" ]; then

            echo ""
            echo "✅ Projet Android trouvé directement à la racine."

            PROJECT_ROOT="."

          else

            # ====================================================
            # CAS 2
            # Recherche d'une archive SBh Studio
            # ====================================================

            ZIP_FILE="$(
              find . \
                -maxdepth 4 \
                -type f \
                \
                  -iname 'SBhStudio*.zip' \
                  -o \
                  -iname '*GitHubReady*.zip' \
                \
                -print \
                | head -n 1 \
                || true
            )"

            if [ -n "$ZIP_FILE" ]; then

              echo ""
              echo "📦 Archive SBh Studio détectée :"
              echo "$ZIP_FILE"

              EXTRACT_DIR="$RUNNER_TEMP/sbh-studio-extracted"

              rm -rf "$EXTRACT_DIR"
              mkdir -p "$EXTRACT_DIR"

              echo ""
              echo "Extraction de l'archive..."

              unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

              echo ""
              echo "Contenu extrait :"

              find "$EXTRACT_DIR" \
                -maxdepth 4 \
                -type f \
                | head -n 150

              # ----------------------------------------------
              # Recherche du vrai projet Android
              # ----------------------------------------------

              FOUND_ROOT="$(
                find "$EXTRACT_DIR" \
                  -type f \
                  -name "settings.gradle.kts" \
                  -print \
                  | while read -r settings_file; do

                      candidate="$(dirname "$settings_file")"

                      if [ -f "$candidate/gradlew" ] &&
                         [ -d "$candidate/app" ]; then

                        echo "$candidate"
                        break

                      fi

                    done \
                  | head -n 1
              )"

              if [ -z "$FOUND_ROOT" ]; then

                echo ""
                echo "❌ Impossible de trouver le projet Android dans le ZIP."

                echo ""
                echo "Fichiers Gradle trouvés :"

                find "$EXTRACT_DIR" \
                  -type f \
                  \
                    -name "settings.gradle.kts" \
                    -o \
                    -name "build.gradle.kts" \
                    -o \
                    -name "gradlew" \
                  \
                  -print

                exit 1
              fi

              echo ""
              echo "✅ Projet Android trouvé :"
              echo "$FOUND_ROOT"

              PROJECT_ROOT="$FOUND_ROOT"

            else

              # ==================================================
              # CAS 3
              # Projet présent dans un sous-dossier
              # ==================================================

              FOUND_ROOT="$(
                find . \
                  -type f \
                  -name "settings.gradle.kts" \
                  -print \
                  | while read -r settings_file; do

                      candidate="$(dirname "$settings_file")"

                      if [ -f "$candidate/gradlew" ] &&
                         [ -d "$candidate/app" ]; then

                        echo "$candidate"
                        break

                      fi

                    done \
                  | head -n 1
              )"

              if [ -n "$FOUND_ROOT" ]; then

                echo ""
                echo "✅ Projet Android trouvé dans :"
                echo "$FOUND_ROOT"

                PROJECT_ROOT="$FOUND_ROOT"

              fi

            fi

          fi

          # ======================================================
          # Vérification finale
          # ======================================================

          if [ -z "$PROJECT_ROOT" ]; then

            echo ""
            echo "❌ PROJET SBH STUDIO INTROUVABLE"

            echo ""
            echo "Le dépôt doit contenir soit :"

            echo "  gradlew"
            echo "  settings.gradle.kts"
            echo "  app/"

            echo ""

            echo "soit une archive :"

            echo "  SBhStudio_V1.4.0_GitHubReady.zip"

            echo ""
            echo "Contenu du dépôt :"

            find . \
              -maxdepth 4 \
              -print

            exit 1

          fi

          # ======================================================
          # Vérification des fichiers essentiels
          # ======================================================

          echo ""
          echo "=========================================="
          echo " Vérification SBh Studio"
          echo "=========================================="

          test -f "$PROJECT_ROOT/gradlew"
          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/version.json"
          test -f "$PROJECT_ROOT/tools/validate_sbh.py"

          echo "✅ gradlew"
          echo "✅ settings.gradle.kts"
          echo "✅ app/build.gradle.kts"
          echo "✅ version.json"
          echo "✅ tools/validate_sbh.py"

          echo ""
          echo "Projet utilisé :"
          echo "$PROJECT_ROOT"

          echo ""
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # 3. Gradle Wrapper
      # ----------------------------------------------------------

      - name: Préparer Gradle Wrapper
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "Gradle Wrapper :"
          ls -lh gradlew

      # ----------------------------------------------------------
      # 4. Python
      # ----------------------------------------------------------

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ----------------------------------------------------------
      # 5. Validation SBh Studio
      # ----------------------------------------------------------

      - name: Validation statique SBh Studio
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/validate_sbh.py

      # ----------------------------------------------------------
      # 6. Vérification V1.4.0
      # ----------------------------------------------------------

      - name: Vérifier version V1.4.0
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="$(
            python3 - <<'PY'
          import json

          with open("version.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(data.get("versionName", ""))
          PY
          )"

          VERSION_CODE="$(
            python3 - <<'PY'
          import json

          with open("version.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(data.get("versionCode", ""))
          PY
          )"

          echo "Version détectée : $VERSION_NAME"
          echo "Version code : $VERSION_CODE"

          if [ "$VERSION_NAME" != "1.4.0" ]; then
            echo "❌ Version attendue : 1.4.0"
            exit 1
          fi

          if [ "$VERSION_CODE" != "29" ]; then
            echo "❌ Version code attendu : 29"
            exit 1
          fi

          echo "✅ SBh Studio V1.4.0 validé."

      # ----------------------------------------------------------
      # 7. Java 17
      # ----------------------------------------------------------

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ----------------------------------------------------------
      # 8. Android SDK
      #
      # IMPORTANT :
      # Ne jamais demander le paquet "tools".
      # Il est déprécié.
      # ----------------------------------------------------------

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      # ----------------------------------------------------------
      # 9. Gradle
      # ----------------------------------------------------------

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      # ----------------------------------------------------------
      # 10. Informations environnement
      # ----------------------------------------------------------

      - name: Vérifier environnement Android
        shell: bash
        run: |
          set -euo pipefail

          echo "Java :"
          java -version

          echo ""
          echo "ADB :"
          adb version

          echo ""
          echo "Android SDK :"
          echo "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-non défini}}"

      # ----------------------------------------------------------
      # 11. Clean
      # ----------------------------------------------------------

      - name: Gradle Clean
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ----------------------------------------------------------
      # 12. Build Debug
      # ----------------------------------------------------------

      - name: Construire APK Debug
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ----------------------------------------------------------
      # 13. Vérification APK
      # ----------------------------------------------------------

      - name: Vérifier APK Debug
        id: debug_apk
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              -print \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "❌ Aucun APK Debug trouvé."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo " APK DEBUG TROUVÉ"
          echo "=========================================="

          echo "$APK"

          echo ""
          echo "Taille :"

          du -h "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release-debug"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release-debug/SBh-Studio-v1.4.0-debug.apk"

          sha256sum "$APK" \
            > "$GITHUB_WORKSPACE/release-debug/SBh-Studio-v1.4.0-debug.apk.sha256"

      # ----------------------------------------------------------
      # 14. Artifact APK Debug
      # ----------------------------------------------------------

      - name: Publier APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: SBh-Studio-v1.4.0-debug
          path: release-debug/
          if-no-files-found: error
          retention-days: 30


  # ============================================================
  # RELEASE SIGNÉE
  # Déclenchée uniquement manuellement
  # ============================================================

  release:
    name: SBh Studio V1.4.0 - Release APK
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_release == true

    permissions:
      contents: write

    steps:

      # ----------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Recherche du projet
      # ----------------------------------------------------------

      - name: Préparer le projet Release
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          # Projet à la racine
          if [ -f "gradlew" ] &&
             [ -f "settings.gradle.kts" ] &&
             [ -d "app" ]; then

            PROJECT_ROOT="."

          else

            # Recherche du ZIP
            ZIP_FILE="$(
              find . \
                -maxdepth 4 \
                -type f \
                \
                  -iname 'SBhStudio*.zip' \
                  -o \
                  -iname '*GitHubReady*.zip' \
                \
                -print \
                | head -n 1 \
                || true
            )"

            if [ -n "$ZIP_FILE" ]; then

              echo "📦 Archive trouvée : $ZIP_FILE"

              EXTRACT_DIR="$RUNNER_TEMP/sbh-release-extracted"

              rm -rf "$EXTRACT_DIR"
              mkdir -p "$EXTRACT_DIR"

              unzip -q "$ZIP_FILE" \
                -d "$EXTRACT_DIR"

              FOUND_ROOT="$(
                find "$EXTRACT_DIR" \
                  -type f \
                  -name "settings.gradle.kts" \
                  -print \
                  | while read -r settings_file; do

                      candidate="$(dirname "$settings_file")"

                      if [ -f "$candidate/gradlew" ] &&
                         [ -d "$candidate/app" ]; then

                        echo "$candidate"
                        break

                      fi

                    done \
                  | head -n 1
              )"

              PROJECT_ROOT="$FOUND_ROOT"

            else

              # Recherche dans les sous-dossiers
              FOUND_ROOT="$(
                find . \
                  -type f \
                  -name "settings.gradle.kts" \
                  -print \
                  | while read -r settings_file; do

                      candidate="$(dirname "$settings_file")"

                      if [ -f "$candidate/gradlew" ] &&
                         [ -d "$candidate/app" ]; then

                        echo "$candidate"
                        break

                      fi

                    done \
                  | head -n 1
              )"

              PROJECT_ROOT="$FOUND_ROOT"

            fi

          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "❌ Projet Android introuvable."
            exit 1
          fi

          test -f "$PROJECT_ROOT/gradlew"
          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/version.json"
          test -f "$PROJECT_ROOT/tools/validate_sbh.py"

          echo "✅ Projet
