# ========================================================
      # JAVA
      # ========================================================

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ========================================================
      # ANDROID (corrigé – compatible avec compileSdk 35)
      # ========================================================

      - name: Préparer Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Installer les composants Android nécessaires
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print \
              -quit)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERREUR : sdkmanager introuvable."
            find "$ANDROID_HOME" -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "sdkmanager utilisé :"
          echo "$SDKMANAGER"

          echo ""
          echo "===== LICENCES ====="
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo ""
          echo "===== COMPOSANTS SBH STUDIO (compileSdk 35) ====="

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
