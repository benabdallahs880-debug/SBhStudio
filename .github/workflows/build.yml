name: Build SBh Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. RÉCUPÉRER LE DÉPÔT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. TROUVER LE ZIP SBh STUDIO
      # =========================================================
      - name: Trouver le projet SBh Studio
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " RECHERCHE DU PROJET SBh STUDIO"
          echo "=========================================="

          ZIP="$(find . -type f -iname 'SBhStudio*.zip' | sort | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "❌ Aucun ZIP SBh Studio trouvé."
            echo ""
            echo "Fichiers présents dans le dépôt :"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "✅ ZIP trouvé :"
          echo "$ZIP"

          rm -rf sbh
          mkdir -p sbh

          echo ""
          echo "Extraction..."

          unzip -q "$ZIP" -d sbh

          echo ""
          echo "Recherche de gradlew..."

          find sbh -type f -name "gradlew" -print

      # =========================================================
      # 3. DÉTECTER AUTOMATIQUEMENT LE DOSSIER ANDROID
      # =========================================================
      - name: Détecter le projet Android
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$(dirname "$(find "$GITHUB_WORKSPACE/sbh" \
            -type f \
            -name 'gradlew' \
            -print -quit)")"

          if [ -z "$ROOT" ] || [ ! -f "$ROOT/gradlew" ]; then
            echo "❌ Impossible de trouver gradlew."

            echo ""
            echo "Structure extraite :"
            find "$GITHUB_WORKSPACE/sbh" \
              -maxdepth 7 \
              -type f \
              | sort

            exit 1
          fi

          echo "=========================================="
          echo " PROJET ANDROID DÉTECTÉ"
          echo "=========================================="

          echo "$ROOT"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Contenu du projet :"
          ls -la "$ROOT"

      # =========================================================
      # 4. JAVA 17
      # =========================================================
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 5. PRÉPARER ANDROID SDK
      #
      # IMPORTANT :
      # On n'utilise PAS android-actions/setup-android@v3.
      # Le runner possède déjà Android SDK.
      # =========================================================
      - name: Préparer Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " ANDROID SDK"
          echo "=========================================="

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "❌ Android SDK introuvable."
            exit 1
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "❌ sdkmanager introuvable ou non exécutable."
            echo ""
            echo "Chemin recherché :"
            echo "$SDKMANAGER"
            echo ""
            echo "Contenu de cmdline-tools :"
            find "$ANDROID_HOME/cmdline-tools" \
              -maxdepth 4 \
              -type f \
              | sort || true
            exit 1
          fi

          echo ""
          echo "sdkmanager :"
          echo "$SDKMANAGER"

          echo ""
          echo "Version SDK manager :"

          "$SDKMANAGER" --version

          echo ""
          echo "Acceptation des licences Android..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo ""
          echo "Installation des composants nécessaires..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "=========================================="
          echo " ANDROID SDK PRÊT"
          echo "=========================================="

      # =========================================================
      # 6. CORRIGER LE PARSING DE version.json
      # =========================================================
      - name: Corriger le parsing Kotlin de version.json
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " CORRECTION build.gradle.kts"
          echo "=========================================="

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")

          if not path.exists():
              raise SystemExit(
                  "❌ app/build.gradle.kts introuvable"
              )

          text = path.read_text(encoding="utf-8")

          lines = text.splitlines()
          result = []

          for line in lines:
              stripped = line.strip()

              # Correction versionCode
              if stripped.startswith(
                  "val sbhVersionCode = Regex("
              ):
                  result.append(
                      'val sbhVersionCode = Regex("""["]versionCode["]\\s*:\\s*(\\d+)""")'
                  )
                  continue

              # Correction versionName
              if stripped.startswith(
                  "val sbhVersionName = Regex("
              ):
                  result.append(
                      'val sbhVersionName = Regex("""["]versionName["]\\s*:\\s*["]([^"]+)["]""")'
                  )
                  continue

              result.append(line)

          path.write_text(
              "\n".join(result) + "\n",
              encoding="utf-8"
          )

          print("✅ build.gradle.kts corrigé.")
          PY

          echo ""
          echo "Vérification du fichier :"

          nl -ba app/build.gradle.kts | sed -n '1,60p'

      # =========================================================
      # 7. LIRE LA VERSION SBh STUDIO
      # =========================================================
      - name: Lire version.json
        id: version
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " VERSION SBh STUDIO"
          echo "=========================================="

          if [ ! -f version.json ]; then
            echo "❌ version.json introuvable."
            exit 1
          fi

          echo ""
          echo "Contenu :"
          cat version.json

          VERSION="$(
            python3 -c '
          import json
          with open("version.json", encoding="utf-8") as f:
              data = json.load(f)
          print(data["versionName"])
          '
          )"

          CODE="$(
            python3 -c '
          import json
          with open("version.json", encoding="utf-8") as f:
              data = json.load(f)
          print(data["versionCode"])
          '
          )"

          echo ""
          echo "Version : $VERSION"
          echo "Code    : $CODE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 8. PRÉPARER GRADLE
      # =========================================================
      - name: Préparer Gradle
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " PRÉPARATION GRADLE"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew --version

      # =========================================================
      # 9. VALIDATION SBh STUDIO
      # =========================================================
      - name: Validation SBh Studio
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " VALIDATION SBh STUDIO"
          echo "=========================================="

          if [ -f tools/validate_sbh.py ]; then

            echo "Validation trouvée."

            python3 tools/validate_sbh.py

          else

            echo "⚠️ tools/validate_sbh.py absent."
            echo "La compilation continue."

          fi

      # =========================================================
      # 10. NETTOYAGE
      # =========================================================
      - name: Nettoyer le projet
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " NETTOYAGE"
          echo "=========================================="

          ./gradlew clean --no-daemon

      # =========================================================
      # 11. COMPILATION APK
      # =========================================================
      - name: Compiler SBh Studio
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " COMPILATION SBh STUDIO"
          echo "=========================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 12. RECHERCHER L'APK
      # =========================================================
      - name: Vérifier APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " RECHERCHE APK"
          echo "=========================================="

          APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print \
              | head -n 1
          )"

          if [ -z "$APK" ]; then

            echo "❌ Aucun APK généré."

            echo ""
            echo "Contenu de app/build :"

            find app/build \
              -maxdepth 7 \
              -type f \
              | sort || true

            exit 1
          fi

          echo "✅ APK trouvé :"
          echo "$APK"

          echo ""
          echo "Taille :"

          ls -lh "$APK"

          echo ""
          echo "SHA-256 :"

          sha256sum "$APK"

      # =========================================================
      # 13. RENOMMER L'APK
      # =========================================================
      - name: Préparer APK final
        id: apk
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "❌ APK introuvable."
            exit 1
          fi

          FINAL="release/SBhStudio-V${{ steps.version.outputs.version }}-debug.apk"

          cp "$APK" "$FINAL"

          echo "=========================================="
          echo " APK FINAL"
          echo "=========================================="

          echo "$FINAL"

          ls -lh "$FINAL"

          echo "path=$FINAL" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 14. PUBLIER L'APK DANS GITHUB ACTIONS
      # =========================================================
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: SBh-Studio-V${{ steps.version.outputs.version }}-APK
          path: ${{ steps.project.outputs.root }}/release/SBhStudio-V${{ steps.version.outputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 15. RAPPORT FINAL
      # =========================================================
      - name: Rapport final
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " SBh STUDIO"
          echo " BUILD TERMINÉ"
          echo "=========================================="
          echo ""
          echo "Version : ${{ steps.version.outputs.version }}"
          echo "Code    : ${{ steps.version.outputs.code }}"
          echo ""
          echo "✅ Projet détecté"
          echo "✅ Java 17"
          echo "✅ Android SDK"
          echo "✅ SDK Manager"
          echo "✅ Correction Kotlin"
          echo "✅ version.json"
          echo "✅ Validation"
          echo "✅ Gradle"
          echo "✅ Compilation APK"
          echo "✅ APK publié"
          echo ""
          echo "APK :"
          echo "SBhStudio-V${{ steps.version.outputs.version }}-debug.apk"
          echo ""
          echo "=========================================="
