name: SBH Studio V1.4

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbh-studio-v1.4-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # 1. INSPECTION DU PROJET
  # ============================================================

  inspect:
    name: Inspect SBH Studio V1.4
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Afficher la structure
        shell: bash
        run: |
          echo "=============================================="
          echo "       SBH STUDIO V1.4 - INSPECTION"
          echo "=============================================="

          echo ""
          echo "Racine du dépôt :"
          ls -lah

          echo ""
          echo "Fichiers importants :"

          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle.properties" \
              -o -name "gradlew" \
              -o -name "AndroidManifest.xml" \
              -o -name "project.godot" \
              -o -name "agw_world_core.json" \
              -o -name "*.json" \
            \) \
            | sort | head -500

      - name: Vérifier la configuration Android/Gradle
        shell: bash
        run: |
          echo "===== DETECTION PROJET ====="

          if [ -f "gradlew" ]; then
            echo "Projet Gradle Android détecté."
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "Configuration Gradle détectée."
          else
            echo "ATTENTION : aucun projet Gradle trouvé à la racine."
          fi

          if [ -f "settings.gradle" ]; then
            echo "settings.gradle trouvé."
          fi

          if [ -f "settings.gradle.kts" ]; then
            echo "settings.gradle.kts trouvé."
          fi

          if [ -d "app" ]; then
            echo "Module app trouvé."
          fi


  # ============================================================
  # 2. BUILD ANDROID
  # ============================================================

  build:
    name: Build SBH Studio V1.4
    runs-on: ubuntu-latest
    needs: inspect

    env:
      JAVA_VERSION: "17"

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # JAVA
      # ----------------------------------------------------------

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ----------------------------------------------------------
      # ANDROID SDK
      # ----------------------------------------------------------

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer composants Android
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # ----------------------------------------------------------
      # GRADLE WRAPPER
      # ----------------------------------------------------------

      - name: Vérifier Gradle Wrapper
        shell: bash
        run: |
          echo "===== GRADLE WRAPPER ====="

          if [ ! -f "gradlew" ]; then
            echo "ERREUR : gradlew introuvable."
            echo ""
            echo "SBH Studio V1.4 doit fournir son Gradle Wrapper."
            exit 1
          fi

          chmod +x gradlew

          ./gradlew --version


      # ----------------------------------------------------------
      # VALIDATION DES FICHIERS
      # ----------------------------------------------------------

      - name: Vérifier les fichiers SBH Studio
        shell: bash
        run: |
          echo "===== VALIDATION PROJET ====="

          test -f "settings.gradle" \
            || test -f "settings.gradle.kts" \
            || {
              echo "ERREUR : settings.gradle(.kts) absent."
              exit 1
            }

          test -f "build.gradle" \
            || test -f "build.gradle.kts" \
            || {
              echo "ERREUR : build.gradle(.kts) absent."
              exit 1
            }

          echo "Configuration Gradle détectée."


      # ----------------------------------------------------------
      # AGW WORLD CORE
      # ----------------------------------------------------------

      - name: Vérifier AGW World Core
        shell: bash
        run: |
          echo "=============================================="
          echo "          AGW WORLD CORE CHECK"
          echo "=============================================="

          FOUND=0

          if find . -type f \
            \( \
              -iname "agw_world_core.json" \
              -o -iname "*agw*world*core*.json" \
              -o -iname "*worldcore*.json" \
            \) | grep -q .; then

            echo "AGW World Core détecté."
            FOUND=1

          fi

          if [ "$FOUND" -eq 0 ]; then
            echo "ATTENTION : AGW World Core non détecté."
            echo "Le build Android peut continuer."
          fi


      # ----------------------------------------------------------
      # VALIDATION JSON
      # ----------------------------------------------------------

      - name: Valider les fichiers JSON
        shell: bash
        run: |
          echo "===== VALIDATION JSON ====="

          python3 - <<'PY'
          import json
          import pathlib
          import sys

          files = list(pathlib.Path(".").rglob("*.json"))

          errors = 0

          for path in files:
              try:
                  with path.open("r", encoding="utf-8") as f:
                      json.load(f)
              except Exception as e:
                  print(f"JSON INVALID : {path}")
                  print(e)
                  errors += 1

          print(f"JSON analysés : {len(files)}")

          if errors:
              print(f"ERREURS JSON : {errors}")
              sys.exit(1)

          print("Tous les JSON sont valides.")
          PY


      # ----------------------------------------------------------
      # GRADLE CLEAN
      # ----------------------------------------------------------

      - name: Nettoyer Gradle
        shell: bash
        run: |
          ./gradlew clean


      # ----------------------------------------------------------
      # COMPILATION
      # ----------------------------------------------------------

      - name: Compiler SBH Studio
        shell: bash
        run: |
          echo "=============================================="
          echo "        COMPILATION SBH STUDIO V1.4"
          echo "=============================================="

          ./gradlew assembleDebug --stacktrace


      # ----------------------------------------------------------
      # TESTS
      # ----------------------------------------------------------

      - name: Tests Gradle
        shell: bash
        run: |
          echo "===== TESTS ====="

          ./gradlew test \
            --stacktrace \
            --continue


      # ----------------------------------------------------------
      # VERIFICATION APK
      # ----------------------------------------------------------

      - name: Rechercher APK
        shell: bash
        run: |
          echo "===== APK ====="

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERREUR : aucun APK généré."
            exit 1
          fi

          echo "APK trouvés : $APK_COUNT"


      # ----------------------------------------------------------
      # RENOMMER APK
      # ----------------------------------------------------------

      - name: Préparer APK SBH Studio
        shell: bash
        run: |
          mkdir -p artifacts

          APK=$(find . \
            -type f \
            -name "*debug*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            APK=$(find . \
              -type f \
              -name "*.apk" \
              | head -1)
          fi

          if [ -z "$APK" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          cp "$APK" \
            "artifacts/SBH_Studio_V1.4_debug.apk"

          ls -lh artifacts/


      # ----------------------------------------------------------
      # ARTIFACT GITHUB
      # ----------------------------------------------------------

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: SBH-Studio-V1.4-Android
          path: artifacts/SBH_Studio_V1.4_debug.apk
          if-no-files-found: error


      # ----------------------------------------------------------
      # RESUME
      # ----------------------------------------------------------

      - name: Rapport final
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "       SBH STUDIO V1.4 BUILD TERMINE"
          echo "=============================================="
          echo ""
          echo "Application : SBH Studio"
          echo "Version     : V1.4"
          echo "Plateforme  : Android"
          echo ""
          echo "APK : SBH_Studio_V1.4_debug.apk"
          echo ""
          echo "Artifact GitHub : SBH-Studio-V1.4-Android"
          echo ""
