name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          ZIP_PATH="./SBhStudio_v0.7.6_FINAL_BUILD_FIX.zip"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "ERREUR : archive officielle SBh Studio introuvable : $ZIP_PATH"
            exit 1
          fi

          echo "Archive utilisée : $ZIP_PATH"

          rm -rf temp_extract
          mkdir -p temp_extract

          unzip -q -o "$ZIP_PATH" -d temp_extract

          GRADLEW_PATH=$(find temp_extract -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERREUR : gradlew introuvable dans l'archive."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")

          chmod +x "$PROJECT_DIR/gradlew"

          GENERATOR="$PROJECT_DIR/app/src/main/java/com/sbh/studio/generator/PackGenerator.kt"

          if [ ! -f "$GENERATOR" ]; then
            echo "ERREUR : PackGenerator.kt introuvable."
            exit 1
          fi

          echo "=== Vérification PackGenerator ==="

          grep -q "fun textureKey" "$GENERATOR" || {
            echo "ERREUR : textureKey manquant"
            exit 1
          }

          grep -q "fun safe" "$GENERATOR" || {
            echo "ERREUR : safe manquant"
            exit 1
          }

          grep -q "fun splitId" "$GENERATOR" || {
            echo "ERREUR : splitId manquant"
            exit 1
          }

          grep -q "fun blockJson" "$GENERATOR" || {
            echo "ERREUR : blockJson manquant"
            exit 1
          }

          grep -q "MAX_TEXTURE" "$GENERATOR" || {
            echo "ERREUR : MAX_TEXTURE manquant"
            exit 1
          }

          echo "PackGenerator corrigé détecté."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Projet utilisé : $PROJECT_DIR"

          echo "=== Gradle ==="
          ./gradlew --version

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Compilation SBh Studio ==="
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "=== APK générés ==="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SBhStudio-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
