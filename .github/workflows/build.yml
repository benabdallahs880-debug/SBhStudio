      - name: Diagnostiquer et corriger les erreurs Kotlin
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " DIAGNOSTIC KOTLIN"
          echo "=========================================="

          MAP_FILE="app/src/main/java/com/sbh/studio/mapeditor/MapEditorScreen.kt"
          REPORT_FILE="app/src/main/java/com/sbh/studio/ui/ReportsScreen.kt"

          test -f "$MAP_FILE"
          test -f "$REPORT_FILE"

          echo ""
          echo "========== MapEditorScreen.kt =========="
          echo "Contexte autour de la ligne 335 :"
          nl -ba "$MAP_FILE" | sed -n '315,350p'

          echo ""
          echo "========== ReportsScreen.kt =========="
          echo "Contexte autour de la ligne 142 :"
          nl -ba "$REPORT_FILE" | sed -n '120,165p'

          echo ""
          echo "========== Imports MapEditor =========="
          grep -n '^import ' "$MAP_FILE" || true

          echo ""
          echo "========== Imports Reports =========="
          grep -n '^import ' "$REPORT_FILE" || true

          echo ""
          echo "========== SUCCESS =========="
          grep -n -C 5 'SUCCESS' "$REPORT_FILE" || true

          echo ""
          echo "========== Recherche des déclarations SUCCESS =========="
          grep -RInE \
            'enum class .*Status|sealed class .*Status|SUCCESS[ ,)]|SUCCESS[=:]' \
            app/src/main/java/com/sbh/studio \
            --include='*.kt' \
            | head -n 200 || true

          echo ""
          echo "========== Recherche de height =========="
          grep -n -C 4 '\.height' "$MAP_FILE" || true

          python3 <<'PY'
          from pathlib import Path
          import re

          map_path = Path("app/src/main/java/com/sbh/studio/mapeditor/MapEditorScreen.kt")
          report_path = Path("app/src/main/java/com/sbh/studio/ui/ReportsScreen.kt")

          map_text = map_path.read_text(encoding="utf-8")
          report_text = report_path.read_text(encoding="utf-8")

          # ------------------------------------------------------------
          # 1. fillMaxWidth
          # ------------------------------------------------------------
          if "fillMaxWidth" in map_text:
              if "import androidx.compose.foundation.layout.fillMaxWidth" not in map_text:
                  lines = map_text.splitlines()

                  package_index = None
                  for i, line in enumerate(lines):
                      if line.startswith("package "):
                          package_index = i
                          break

                  if package_index is not None:
                      insert_at = package_index + 1

                      while (
                          insert_at < len(lines)
                          and (
                              lines[insert_at].strip() == ""
                              or lines[insert_at].startswith("import ")
                          )
                      ):
                          insert_at += 1

                      lines.insert(
                          insert_at,
                          "import androidx.compose.foundation.layout.fillMaxWidth"
                      )

                      map_path.write_text(
                          "\n".join(lines) + "\n",
                          encoding="utf-8"
                      )

                      print("✅ Import fillMaxWidth ajouté.")
              else:
                  print("✅ fillMaxWidth déjà importé.")

          # ------------------------------------------------------------
          # 2. height
          # ------------------------------------------------------------
          #
          # Le compilateur indique simplement "height" sans préciser
          # le symbole attendu. On ne remplace donc PAS aveuglément.
          #
          # On vérifie d'abord si height est utilisé comme modifier
          # Compose, par exemple .height(...).
          #
          if re.search(r'\.height\s*\(', map_text):
              if "import androidx.compose.foundation.layout.height" not in map_text:
                  lines = map_text.splitlines()

                  package_index = None
                  for i, line in enumerate(lines):
                      if line.startswith("package "):
                          package_index = i
                          break

                  if package_index is not None:
                      insert_at = package_index + 1

                      while (
                          insert_at < len(lines)
                          and (
                              lines[insert_at].strip() == ""
                              or lines[insert_at].startswith("import ")
                          )
                      ):
                          insert_at += 1

                      lines.insert(
                          insert_at,
                          "import androidx.compose.foundation.layout.height"
                      )

                      map_path.write_text(
                          "\n".join(lines) + "\n",
                          encoding="utf-8"
                      )

                      print("✅ Import Compose height ajouté.")
              else:
                  print("✅ Import Compose height déjà présent.")
          else:
              print("⚠️ height n'est pas utilisé sous la forme .height(...).")
              print("⚠️ Aucun remplacement automatique effectué.")

          # ------------------------------------------------------------
          # 3. SUCCESS
          # ------------------------------------------------------------
          #
          # On ne devine pas le nom d'un enum.
          # On cherche les types réellement utilisés dans le fichier.
          #
          success_lines = [
              (i + 1, line)
              for i, line in enumerate(report_text.splitlines())
              if "SUCCESS" in line
          ]

          print("")
          print("Occurrences SUCCESS :")
          for number, line in success_lines:
              print(f"{number}: {line}")

          # Si SUCCESS est déjà qualifié, aucune action.
          # Exemple : ValidationStatus.SUCCESS
          #
          # Si c'est simplement SUCCESS, on cherche les enum/classes
          # susceptibles de contenir SUCCESS dans tout le projet.
          plain_success = [
              (number, line)
              for number, line in success_lines
              if re.search(r'\bSUCCESS\b', line)
              and not re.search(r'\b[A-Za-z_][A-Za-z0-9_]*\.SUCCESS\b', line)
          ]

          if plain_success:
              root = Path("app/src/main/java")

              candidates = []

              for file in root.rglob("*.kt"):
                  text = file.read_text(encoding="utf-8", errors="ignore")

                  if not re.search(r'\bSUCCESS\b', text):
                      continue

                  # enum class Foo { ..., SUCCESS, ... }
                  for match in re.finditer(
                      r'enum\s+class\s+([A-Za-z_][A-Za-z0-9_]*)\s*\{([^}]*)\}',
                      text,
                      re.S
                  ):
                      enum_name = match.group(1)
                      body = match.group(2)

                      if re.search(r'\bSUCCESS\b', body):
                          candidates.append(
                              (
                                  str(file),
                                  enum_name,
                                  "enum"
                              )
                          )

                  # sealed class Foo / object SUCCESS
                  for match in re.finditer(
                      r'(?:class|object)\s+([A-Za-z_][A-Za-z0-9_]*)',
                      text
                  ):
                      name = match.group(1)

                      if name == "SUCCESS":
                          candidates.append(
                              (
                                  str(file),
                                  name,
                                  "class/object"
                              )
                          )

              print("")
              print("Candidats SUCCESS :")

              for candidate in candidates:
                  print(
                      f"  fichier={candidate[0]} "
                      f"type={candidate[1]} "
                      f"nature={candidate[2]}"
                  )

              # Correction automatique uniquement si UN SEUL enum
              # contient SUCCESS.
              enum_candidates = [
                  candidate
                  for candidate in candidates
                  if candidate[2] == "enum"
              ]

              unique_enums = []
              seen = set()

              for file, enum_name, kind in enum_candidates:
                  key = (file, enum_name)
                  if key not in seen:
                      seen.add(key)
                      unique_enums.append(key)

              if len(unique_enums) == 1:
                  enum_file, enum_name = unique_enums[0]

                  print("")
                  print(
                      f"✅ Enum SUCCESS déterminé automatiquement : "
                      f"{enum_name}"
                  )

                  updated = report_text

                  # Remplace uniquement SUCCESS non précédé par un identifiant.
                  updated = re.sub(
                      r'(?<![\w.])SUCCESS\b',
                      f"{enum_name}.SUCCESS",
                      updated
                  )

                  report_path.write_text(
                      updated,
                      encoding="utf-8"
                  )

                  print(
                      f"✅ SUCCESS remplacé par {enum_name}.SUCCESS"
                  )
              else:
                  print("")
                  print(
                      "⚠️ Impossible de déterminer automatiquement "
                      "le propriétaire de SUCCESS."
                  )
                  print(
                      "⚠️ Aucun remplacement spéculatif effectué."
                  )
                  print(
                      "⚠️ Le build s'arrêtera ici avec le diagnostic "
                      "complet ci-dessus."
                  )

          print("")
          print("==========================================")
          print(" CORRECTIONS TERMINÉES")
          print("==========================================")
          PY

          echo ""
          echo "========== Vérification finale =========="

          echo ""
          echo "MapEditorScreen.kt:"
          grep -n -E 'fillMaxWidth|\.height' "$MAP_FILE" || true

          echo ""
          echo "ReportsScreen.kt:"
          nl -ba "$REPORT_FILE" | sed -n '135,150p'

          echo ""
          echo "Imports:"
          grep -n '^import androidx.compose.foundation.layout' "$MAP_FILE" || true

          echo ""
          echo "=========================================="
          echo " FIN DIAGNOSTIC"
          echo "=========================================="
