name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract project ZIP
      run: |
        unzip -o SBhStudio_ready.zip -d temp_extract
        GRADLEW_PATH=$(find temp_extract -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          DIR_PATH=$(dirname "$GRADLEW_PATH")
          cp -r "$DIR_PATH"/* .
        fi
        rm -rf temp_extract
        chmod +x gradlew || true

    - name: Force Java 17 in Gradle configuration
      run: |
        find . -name "build.gradle*" -exec sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' {} +
        find . -name "build.gradle*" -exec sed -i 's/JVM_1_8/JVM_17/g' {} +
        find . -name "build.gradle*" -exec sed -i 's/"1.8"/"17"/g' {} +

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
