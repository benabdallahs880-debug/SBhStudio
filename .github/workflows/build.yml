name: Build SBh Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build SBh Studio
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. EXTRAIRE SBH STUDIO
      # ============================================================
      - name: Extraire le projet SBh Studio
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " RECHERCHE DU PROJET SBH STUDIO"
          echo "=========================================="

          ZIP=""

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname 'SBhStudio*.zip' \
            -print \
            | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "❌ Aucun ZIP SBh Studio trouvé."

            echo ""
            echo "===== FICHIERS DU DÉPÔT ====="

            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -type f \
              -print \
              | sort \
              | head -n 1000

            exit 1
          fi

          echo "✅ Archive trouvée :"
          echo "$ZIP"

          BUILD_DIR="$GITHUB_WORKSPACE/.sbh-build"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          echo ""
          echo "Extraction de l'archive..."

          unzip -q "$ZIP" -d "$BUILD_DIR"

          echo "✅ Archive extraite."

          echo ""
          echo "Recherche de gradlew..."

          GRADLEW="$(find "$BUILD_DIR" \
            -type f \
            -name gradlew \
            -print \
            | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo "❌ gradlew introuvable après extraction."

            echo ""
            echo "===== CONTENU EXTRAIT ====="

            find "$BUILD_DIR" \
              -maxdepth 8 \
              -type f \
              -print \
              | sort \
              | head -n 2000

            exit 1
          fi

          ROOT="$(dirname "$GRADLEW")"

          echo ""
          echo "=========================================="
          echo " PROJET ANDROID TROUVÉ"
          echo "=========================================="

          echo "$ROOT"

          if [ ! -f "$ROOT/gradlew" ]; then
            echo "❌ gradlew absent."
            exit 1
          fi

          if [ ! -d "$ROOT/app" ]; then
            echo "❌ Dossier app/ absent."
            exit 1
          fi

          chmod +x "$ROOT/gradlew"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

          echo ""
          echo "✅ Projet SBh Studio prêt."

      # ============================================================
      # 4. DIAGNOSTIC STRUCTURE
      # ============================================================
      - name: Diagnostiquer le projet
        working-directory: ${{ steps.extract.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " STRUCTURE SBH STUDIO"
          echo "=========================================="

          echo ""
          echo "Projet :"
          pwd

          echo ""
          echo "Fichiers Gradle :"

          find . \
            -maxdepth 5 \
            -type f \
            -name 'build.gradle' \
            -print

          find . \
            -maxdepth 5 \
            -type f \
            -name 'build.gradle.kts' \
            -print

          find . \
            -maxdepth 5 \
            -type f \
            -name 'settings.gradle' \
            -print

          find . \
            -maxdepth 5 \
            -type f \
            -name 'settings.gradle.kts' \
            -print

          find . \
            -maxdepth 6 \
            -type f \
            -name 'gradle-wrapper.properties' \
            -print

          echo ""
          echo "Wrapper :"

          ls -lh gradlew

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================
      - name: Préparer Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "❌ sdkmanager introuvable ou non exécutable."
            exit 1
          fi

          echo ""
          echo "Version sdkmanager :"

          "$SDKMANAGER" --version

          echo ""
          echo "Acceptation des licences Android..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo ""
          echo "Installation Android SDK..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "✅ Android SDK prêt."

      # ============================================================
      # 6. VERSION
      # ============================================================
      - name: Vérifier version.json
        id: version
        working-directory: ${{ steps.extract.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "version.json" ]; then
            echo "❌ version.json absent."

            echo ""
            echo "Recherche :"

            find . \
              -name 'version.json' \
              -print

            exit 1
          fi

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("version.json")

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          if "versionName" not in data:
              raise SystemExit(
                  "❌ versionName absent."
              )

          if "versionCode" not in data:
              raise SystemExit(
                  "❌ versionCode absent."
              )

          version_name = str(
              data["versionName"]
          )

          version_code = int(
              data["versionCode"]
          )

          print(
              f"Version SBh Studio : {version_name}"
          )

          print(
              f"Version Code      : {version_code}"
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write(
                  f"version={version_name}\n"
              )

              f.write(
                  f"code={version_code}\n"
              )
          PY

      # ============================================================
      # 7. BUILD GRADLE
      # ============================================================
      - name: Vérifier et corriger build.gradle.kts
        working-directory: ${{ steps.extract.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "❌ $FILE introuvable."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/build.gradle.kts"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          if not re.search(
              r'(?m)^android\s*\{',
              text
          ):
              raise SystemExit(
                  "❌ Bloc android { introuvable."
              )

          patterns = [
              r'(?ms)^[ \t]*val\s+sbhVersionText\s*=.*?(?=^[ \t]*(?:val\s+|android\s*\{)|\Z)',
              r'(?ms)^[ \t]*val\s+sbhVersionCode\s*=.*?(?=^[ \t]*(?:val\s+|android\s*\{)|\Z)',
              r'(?ms)^[ \t]*val\s+sbhVersionName\s*=.*?(?=^[ \t]*(?:val\s+|android\s*\{)|\Z)',
          ]

          for pattern in patterns:
              text = re.sub(
                  pattern,
                  "",
                  text
              )

          match = re.search(
              r'(?m)^android\s*\{',
              text
          )

          if not match:
              raise SystemExit(
                  "❌ android { introuvable."
              )

          block = r'''
          val sbhVersionText = file("../version.json").readText()

          val sbhVersionCode: Int =
              Regex("""["]versionCode["]\s*:\s*(\d+)""")
                  .find(sbhVersionText)
                  ?.groupValues
                  ?.get(1)
                  ?.toInt()
                  ?: error("version.json: versionCode manquant")

          val sbhVersionName: String =
              Regex("""["]versionName["]\s*:\s*["]([^"]+)["]""")
                  .find(sbhVersionText)
                  ?.groupValues
                  ?.get(1)
                  ?: error("version.json: versionName manquant")
          '''

          text = (
              text[:match.start()]
              + block.strip()
              + "\n\n"
              + text[match.start():].lstrip()
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          final_text = path.read_text(
              encoding="utf-8"
          )

          if final_text.count(
              "val sbhVersionText"
          ) != 1:
              raise SystemExit(
                  "❌ sbhVersionText incorrect."
              )

          if final_text.count(
              "val sbhVersionCode"
          ) != 1:
              raise SystemExit(
                  "❌ sbhVersionCode incorrect."
              )

          if final_text.count(
              "val sbhVersionName"
          ) != 1:
              raise SystemExit(
                  "❌ sbhVersionName incorrect."
              )

          print(
              "✅ build.gradle.kts vérifié."
          )
          PY

      # ============================================================
      # 8. IMPORTS MAP EDITOR
      # ============================================================
      - name: Corriger les imports Kotlin connus
        working-directory: ${{ steps.extract.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          MAP_FILE="app/src/main/java/com/sbh/studio/mapeditor/MapEditorScreen.kt"

          if [ ! -f "$MAP_FILE" ]; then
            echo "⚠️ MapEditorScreen.kt introuvable."
            exit 0
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/sbh/studio/mapeditor/MapEditorScreen.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          imports = []

          if "fillMaxWidth" in text:
              imports.append(
                  "import androidx.compose.foundation.layout.fillMaxWidth"
              )

          if ".height(" in text:
              imports.append(
                  "import androidx.compose.foundation.layout.height"
              )

          lines = text.splitlines()

          package_index = None

          for i, line in enumerate(lines):
              if line.startswith("package "):
                  package_index = i
                  break

          if package_index is None:
              raise SystemExit(
                  "❌ package introuvable."
              )

          existing = set(lines)

          missing = [
              item
              for item in imports
              if item not in existing
          ]

          if missing:
              insert_at = package_index + 1

              while (
                  insert_at < len(lines)
                  and (
                      lines[insert_at].strip() == ""
                      or lines[insert_at].startswith("import ")
                  )
              ):
                  insert_at += 1

              for item in reversed(missing):
                  lines.insert(
                      insert_at,
                      item
                  )

              path.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8"
              )

              for item in missing:
                  print(
                      f"✅ Import ajouté : {item}"
                  )
          else:
              print(
                  "✅ Imports déjà présents."
              )
          PY

      # ============================================================
      # 9. REPORTS SCREEN
      # ============================================================
      - name: Diagnostiquer ReportsScreen
        working-directory: ${{ steps.extract.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          REPORT_FILE="app/src/main/java/com/sbh/studio/ui/ReportsScreen.kt"

          if [ ! -f "$REPORT_FILE" ]; then
            echo "⚠️ ReportsScreen.kt introuvable."
            exit 0
          fi

          echo "=========================================="
          echo " REPORTS SCREEN"
          echo "=========================================="

          nl -ba "$REPORT_FILE" \
            | sed -n '120,180p'

          echo ""
          echo "Occurrences SUCCESS :"

          grep -n -C 4 \
            "SUCCESS" \
            "$REPORT_FILE" || true

          echo ""
          echo "États disponibles :"

          grep -RInE \
            'READY_TO_SEND|IMPORT_CONFIRMED|SUCCESS|enum class .*Status|sealed class .*Status' \
            app/src/main/java/com/sbh/studio \
            --include='*.kt' \
            | head -n 250 || true

      # ============================================================
      # 10. VALIDATION
      # ============================================================
      - name: Validation SBh Studio
        working-directory: ${{ steps.extract.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "tools/validate_sbh.py" ]; then
            python3 tools/validate_sbh.py
          else
            echo "⚠️ tools/validate_sbh.py absent."
          fi

      # ============================================================
      # 11. GRADLE
      # ============================================================
      - name: Préparer Gradle
        working-directory: ${{ steps.extract.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 12. CLEAN
      # ============================================================
      - name: Nettoyer le projet
        working-directory: ${{ steps.extract.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 13. BUILD APK
      # ============================================================
      - name: Compiler APK Debug
        working-directory: ${{ steps.extract.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " COMPILATION SBH STUDIO"
          echo "=========================================="

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ============================================================
      # 14. VÉRIFIER APK
      # ============================================================
      - name: Vérifier APK
        id: apk
        working-directory: ${{ steps.extract.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "❌ Aucun APK généré."

            find app/build/outputs \
              -type f \
              -print \
              | sort || true

            exit 1
          fi

          SHA256="$(
            sha256sum "$APK" \
            | awk '{print $1}'
          )"

          echo "APK : $APK"
          echo "SHA-256 : $SHA256"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 15. APK FINAL
      # ============================================================
      - name: Préparer APK final
        working-directory: ${{ steps.extract.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          APK="${{ steps.apk.outputs.apk }}"

          FINAL_APK="release/SBhStudio-V${{ steps.version.outputs.version }}-debug.apk"

          cp "$APK" "$FINAL_APK"

          sha256sum "$FINAL_APK" \
            > "${FINAL_APK}.sha256"

          echo ""
          echo "=========================================="
          echo " SBH STUDIO BUILD TERMINÉ"
          echo "=========================================="

          echo "Version : ${{ steps.version.outputs.version }}"
          echo "Code    : ${{ steps.version.outputs.code }}"

          echo ""
          ls -lh release/

      # ============================================================
      # 16. ARTIFACT GITHUB
      # ============================================================
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: SBh-Studio-V${{ steps.version.outputs.version }}-APK
          path: |
            ${{ steps.extract.outputs.root }}/release/*.apk
            ${{ steps.extract.outputs.root }}/release/*.sha256
          if-no-files-found: error
          retention-days: 30
