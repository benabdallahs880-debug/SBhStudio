name: Build SBh Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. TROUVER ET EXTRAIRE LE ZIP
      # =========================================================
      - name: Extraire SBh Studio
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " EXTRACTION SBh STUDIO"
          echo "=========================================="

          ZIP="$(find . -type f -iname 'SBhStudio*.zip' | sort | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "❌ Aucun ZIP SBhStudio*.zip trouvé."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "✅ ZIP : $ZIP"

          rm -rf sbh
          mkdir -p sbh

          unzip -q "$ZIP" -d sbh

          echo ""
          echo "Recherche de gradlew :"
          find sbh -type f -name gradlew -print

      # =========================================================
      # 3. DÉTECTER LE PROJET
      # =========================================================
      - name: Détecter le projet Android
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$(dirname "$(find "$GITHUB_WORKSPACE/sbh" \
            -type f \
            -name gradlew \
            -print -quit)")"

          if [ -z "$ROOT" ] || [ ! -f "$ROOT/gradlew" ]; then
            echo "❌ gradlew introuvable."

            find "$GITHUB_WORKSPACE/sbh" \
              -maxdepth 7 \
              -type f \
              | sort

            exit 1
          fi

          echo "=========================================="
          echo " PROJET ANDROID"
          echo "=========================================="

          echo "$ROOT"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

          ls -la "$ROOT"

      # =========================================================
      # 4. JAVA 17
      # =========================================================
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 5. ANDROID SDK
      # =========================================================
      - name: Préparer Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " ANDROID SDK"
          echo "=========================================="

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "❌ sdkmanager introuvable."
            exit 1
          fi

          echo ""
          echo "sdkmanager : $SDKMANAGER"

          echo ""
          echo "Version :"
          "$SDKMANAGER" --version

          echo ""
          echo "Licences Android..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo ""
          echo "Installation Android..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "✅ Android SDK prêt."

      # =========================================================
      # 6. CORRECTION COMPLÈTE DE version.json
      # =========================================================
      - name: Corriger version.json dans build.gradle.kts
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " CORRECTION VERSION"
          echo "=========================================="

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")

          if not path.exists():
              raise SystemExit(
                  "❌ app/build.gradle.kts introuvable"
              )

          text = path.read_text(encoding="utf-8")

          # -----------------------------------------------------
          # Remplacer tout le bloc de lecture de version.json
          # jusqu'au début du bloc android {.
          # -----------------------------------------------------

          android_match = re.search(
              r'(?m)^android\s*\{',
              text
          )

          if not android_match:
              raise SystemExit(
                  "❌ Bloc android { introuvable dans app/build.gradle.kts"
              )

          before_android = text[:android_match.start()]
          after_android = text[android_match.start():]

          # Chercher le début probable du bloc version.
          # On retire les anciennes déclarations sbhVersionCode
          # et sbhVersionName, y compris leurs continuations.
          before_android = re.sub(
              r'(?ms)^val\s+sbhVersionCode\s*=.*?(?=^val\s+sbhVersionName\s*=|^android\s*\{)',
              '',
              before_android
          )

          before_android = re.sub(
              r'(?ms)^val\s+sbhVersionName\s*=.*?(?=^android\s*\{)',
              '',
              before_android
          )

          # Nettoyer les anciennes lignes éventuelles restantes.
          before_android = re.sub(
              r'(?m)^val\s+sbhVersionCode\s*=.*\n?',
              '',
              before_android
          )

          before_android = re.sub(
              r'(?m)^val\s+sbhVersionName\s*=.*\n?',
              '',
              before_android
          )

          # -----------------------------------------------------
          # Nouveau bloc propre.
          # -----------------------------------------------------

          version_block = r'''
          val sbhVersionText = file("../version.json").readText()

          val sbhVersionCode =
              Regex("""["]versionCode["]\s*:\s*(\d+)""")
                  .find(sbhVersionText)
                  ?.groupValues
                  ?.get(1)
                  ?.toInt()
                  ?: error("version.json: versionCode manquant")

          val sbhVersionName =
              Regex("""["]versionName["]\s*:\s*["]([^"]+)["]""")
                  .find(sbhVersionText)
                  ?.groupValues
                  ?.get(1)
                  ?: error("version.json: versionName manquant")

          '''

          # Ajouter le bloc juste avant android {
          fixed = (
              before_android.rstrip()
              + "\n\n"
              + version_block.strip()
              + "\n\n"
              + after_android.lstrip()
          )

          path.write_text(
              fixed,
              encoding="utf-8"
          )

          print("✅ Bloc version.json reconstruit proprement.")
          PY

          echo ""
          echo "=========================================="
          echo " EXAMEN DU build.gradle.kts"
          echo "=========================================="

          nl -ba app/build.gradle.kts | sed -n '1,70p'

      # =========================================================
      # 7. VÉRIFIER version.json
      # =========================================================
      - name: Vérifier version.json
        id: version
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " VERSION SBh STUDIO"
          echo "=========================================="

          if [ ! -f version.json ]; then
            echo "❌ version.json introuvable."
            exit 1
          fi

          cat version.json

          VERSION="$(
            python3 -c '
          import json
          with open("version.json", encoding="utf-8") as f:
              data = json.load(f)
          print(data["versionName"])
          '
          )"

          CODE="$(
            python3 -c '
          import json
          with open("version.json", encoding="utf-8") as f:
              data = json.load(f)
          print(data["versionCode"])
          '
          )"

          echo ""
          echo "Version : $VERSION"
          echo "Code    : $CODE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 8. GRADLE
      # =========================================================
      - name: Préparer Gradle
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " GRADLE"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew --version

      # =========================================================
      # 9. VALIDATION SBh
      # =========================================================
      - name: Validation SBh Studio
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " VALIDATION"
          echo "=========================================="

          if [ -f tools/validate_sbh.py ]; then
            python3 tools/validate_sbh.py
          else
            echo "⚠️ validate_sbh.py absent."
            echo "Compilation maintenue."
          fi

      # =========================================================
      # 10. NETTOYAGE
      # =========================================================
      - name: Nettoyer le projet
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " NETTOYAGE"
          echo "=========================================="

          ./gradlew clean --no-daemon

      # =========================================================
      # 11. COMPILATION
      # =========================================================
      - name: Compiler APK Debug
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " COMPILATION SBh STUDIO"
          echo "=========================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 12. VÉRIFIER APK
      # =========================================================
      - name: Vérifier APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " APK GÉNÉRÉ"
          echo "=========================================="

          APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "❌ Aucun APK généré."

            find app/build \
              -maxdepth 7 \
              -type f \
              | sort || true

            exit 1
          fi

          echo "✅ APK : $APK"

          echo ""
          echo "Taille :"
          ls -lh "$APK"

          echo ""
          echo "SHA256 :"
          sha256sum "$APK"

      # =========================================================
      # 13. PRÉPARER L'APK FINAL
      # =========================================================
      - name: Préparer APK final
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "❌ APK introuvable."
            exit 1
          fi

          FINAL="release/SBhStudio-V${{ steps.version.outputs.version }}-debug.apk"

          cp "$APK" "$FINAL"

          echo ""
          echo "APK final :"
          ls -lh "$FINAL"

      # =========================================================
      # 14. ARTIFACT GITHUB
      # =========================================================
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: SBh-Studio-V${{ steps.version.outputs.version }}-APK
          path: ${{ steps.project.outputs.root }}/release/SBhStudio-V${{ steps.version.outputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 15. RAPPORT FINAL
      # =========================================================
      - name: Rapport final
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " SBh STUDIO - BUILD TERMINÉ"
          echo "=========================================="
          echo ""
          echo "Version : ${{ steps.version.outputs.version }}"
          echo "Code    : ${{ steps.version.outputs.code }}"
          echo ""
          echo "✅ ZIP extrait"
          echo "✅ Projet Android détecté"
          echo "✅ Java 17"
          echo "✅ Android SDK"
          echo "✅ version.json corrigé"
          echo "✅ Validation"
          echo "✅ Gradle"
          echo "✅ APK compilé"
          echo "✅ APK publié"
          echo ""
          echo "SBhStudio-V${{ steps.version.outputs.version }}-debug.apk"
          echo ""
          echo "=========================================="
