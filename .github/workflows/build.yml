name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publier une GitHub Release avec l'APK signé"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. Validation + APK Debug
  # ============================================================
  analyze-and-debug:
    name: Validate + Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier la structure du projet
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Vérification SBh Studio ==="

          test -f gradlew
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f version.json
          test -f tools/validate_sbh.py

          echo "Structure Android détectée."

      - name: Donner les droits à Gradle
        run: chmod +x gradlew

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validation statique SBh Studio
        run: |
          python3 tools/validate_sbh.py

      - name: Vérifier la version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME=$(python3 - <<'PY'
          import json
          with open("version.json", encoding="utf-8") as f:
              print(json.load(f)["versionName"])
          PY
          )

          VERSION_CODE=$(python3 - <<'PY'
          import json
          with open("version.json", encoding="utf-8") as f:
              print(json.load(f)["versionCode"])
          PY
          )

          echo "SBh Studio version: ${VERSION_NAME}"
          echo "Version code: ${VERSION_CODE}"

          test "$VERSION_NAME" = "1.4.0"
          test "$VERSION_CODE" = "29"

      - name: Configuration Android
        uses: android-actions/setup-android@v3

      - name: Nettoyage Gradle
        run: ./gradlew clean --no-daemon

      - name: Build APK Debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Vérifier APK Debug
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK Debug trouvé : $APK"
          ls -lh "$APK"

      - name: Publier APK Debug comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: SBh-Studio-${{ github.sha }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ============================================================
  # 2. APK Release signé
  # ============================================================
  release:
    name: Build Release APK
    needs: analyze-and-debug
    if: >
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.publish_release == true
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Donner les droits à Gradle
        run: chmod +x gradlew

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validation SBh Studio
        run: python3 tools/validate_sbh.py

      - name: Configuration Android
        uses: android-actions/setup-android@v3

      # ----------------------------------------------------------
      # Signature Android
      # ----------------------------------------------------------
      - name: Préparer la clé de signature
        env:
          SBH_KEYSTORE_B64: ${{ secrets.SBH_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          test -n "$SBH_KEYSTORE_B64"

          echo "$SBH_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/sbh-release.keystore"

          test -s "$RUNNER_TEMP/sbh-release.keystore"

      - name: Vérifier les secrets de signature
        env:
          SBH_KEYSTORE_PASSWORD: ${{ secrets.SBH_KEYSTORE_PASSWORD }}
          SBH_KEY_ALIAS: ${{ secrets.SBH_KEY_ALIAS }}
          SBH_KEY_PASSWORD: ${{ secrets.SBH_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$SBH_KEYSTORE_PASSWORD"
          test -n "$SBH_KEY_ALIAS"
          test -n "$SBH_KEY_PASSWORD"

          echo "Secrets de signature présents."

      # ----------------------------------------------------------
      # Build Release
      # ----------------------------------------------------------
      - name: Build APK Release signé
        env:
          SBH_KEYSTORE_FILE: ${{ runner.temp }}/sbh-release.keystore
          SBH_KEYSTORE_PASSWORD: ${{ secrets.SBH_KEYSTORE_PASSWORD }}
          SBH_KEY_ALIAS: ${{ secrets.SBH_KEY_ALIAS }}
          SBH_KEY_PASSWORD: ${{ secrets.SBH_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Vérifier APK Release
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK"
          test -f "$APK"

          echo "APK Release : $APK"

          mkdir -p release
          cp "$APK" release/SBh-Studio-v1.4.0.apk

      # ----------------------------------------------------------
      # SHA256
      # ----------------------------------------------------------
      - name: Générer SHA256
        run: |
          cd release
          sha256sum SBh-Studio-v1.4.0.apk > SBh-Studio-v1.4.0.apk.sha256
          cat SBh-Studio-v1.4.0.apk.sha256

      # ----------------------------------------------------------
      # Artifact
      # ----------------------------------------------------------
      - name: Publier APK Release comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: SBh-Studio-v1.4.0-release
          path: |
            release/SBh-Studio-v1.4.0.apk
            release/SBh-Studio-v1.4.0.apk.sha256
          if-no-files-found: error

      # ----------------------------------------------------------
      # GitHub Release
      # ----------------------------------------------------------
      - name: Créer GitHub Release
        if: github.event_name == 'push' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: SBh Studio v1.4.0
          generate_release_notes: true
          files: |
            release/SBh-Studio-v1.4.0.apk
            release/SBh-Studio-v1.4.0.apk.sha256
