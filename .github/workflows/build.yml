name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          ZIP_PATH="./SBhStudio_v0.9.0_factions_home.zip"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "ERREUR : archive introuvable : $ZIP_PATH"
            echo "Archives disponibles :"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Archive utilisée : $ZIP_PATH"

          rm -rf temp_extract
          mkdir -p temp_extract

          unzip -q -o "$ZIP_PATH" -d temp_extract

          GRADLEW_PATH=$(find temp_extract -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERREUR : gradlew introuvable dans l'archive."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Projet Android trouvé : $PROJECT_DIR"

          GENERATOR="$PROJECT_DIR/app/src/main/java/com/sbh/studio/generator/PackGenerator.kt"

          if [ ! -f "$GENERATOR" ]; then
            echo "ERREUR : PackGenerator.kt introuvable."
            exit 1
          fi

          echo "=== Vérification PackGenerator ==="

          grep -q "fun textureKey" "$GENERATOR" || exit 1
          grep -q "fun safe" "$GENERATOR" || exit 1
          grep -q "fun splitId" "$GENERATOR" || exit 1
          grep -q "fun blockJson" "$GENERATOR" || exit 1
          grep -q "MAX_TEXTURE" "$GENERATOR" || exit 1

          echo "PackGenerator corrigé détecté."

          echo "=== Vérification Factions ==="

          FACTIONS_JSON="$PROJECT_DIR/app/src/main/assets/agw/factions.json"

          if [ ! -f "$FACTIONS_JSON" ]; then
            echo "ERREUR : factions.json introuvable."
            exit 1
          fi

          echo "factions.json détecté."

          echo "=== Vérification Map Studio ==="

          MAP_STUDIO="$PROJECT_DIR/app/src/main/assets/mapstudio.html"

          if [ ! -f "$MAP_STUDIO" ]; then
            echo "ERREUR : mapstudio.html introuvable."
            exit 1
          fi

          grep -q "codePreview" "$MAP_STUDIO" || exit 1
          grep -q "btnCodePreview" "$MAP_STUDIO" || exit 1
          grep -q "renderCodePreview" "$MAP_STUDIO" || exit 1

          echo "Map Code + aperçu détectés."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Gradle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew --version

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "=== Compilation SBh Studio V0.9.0 Factions ==="

          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "=== APK générés ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SBhStudio-V0.9.0-Factions-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
