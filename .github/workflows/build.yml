name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publier une GitHub Release (APK signé)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-debug:
    name: Analyze + Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Localiser la racine Gradle (studio)
        id: root
        run: |
          set -euo pipefail
          # 1) déjà à la racine
          if [ -f gradlew ] && [ -f settings.gradle.kts ]; then
            echo "project_root=." >> "$GITHUB_OUTPUT"
            echo "Racine Gradle: ."
            exit 0
          fi
          # 2) chercher gradlew dans le dépôt
          FOUND=$(find . -name gradlew -type f 2>/dev/null | head -1 || true)
          if [ -z "$FOUND" ]; then
            echo "::error::gradlew introuvable dans le dépôt."
            echo "Contenu de la racine:"
            ls -la
            echo "Arborescence (3 niveaux):"
            find . -maxdepth 3 -type f -name "*.kts" -o -name "gradlew" -o -name "version.json" 2>/dev/null | head -50
            exit 1
          fi
          DIR=$(dirname "$FOUND")
          echo "project_root=$DIR" >> "$GITHUB_OUTPUT"
          echo "Racine Gradle détectée: $DIR"

      - name: Vérifier la structure
        working-directory: ${{ steps.root.outputs.project_root }}
        run: |
          set -euo pipefail
          echo "== Structure dans $(pwd) =="
          for f in gradlew settings.gradle.kts build.gradle.kts app/build.gradle.kts version.json app/src/main/AndroidManifest.xml; do
            test -e "$f" || { echo "MANQUANT: $f"; ls -la; exit 1; }
            echo "OK  $f"
          done
          for f in \
            app/src/main/java/com/sbh/studio/MainActivity.kt \
            app/src/main/java/com/sbh/studio/settlement/SettlementScreen.kt \
            app/src/main/java/com/sbh/studio/settlement/SettlementRepository.kt \
            app/src/main/java/com/sbh/studio/mapeditor/MapEditorScreen.kt \
            app/src/main/assets/mapstudio.html
          do
            test -e "$f" || { echo "MANQUANT (module SBh): $f"; exit 1; }
            echo "OK  $f"
          done
          echo "Structure validée."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync version.json → Gradle + assets
        working-directory: ${{ steps.root.outputs.project_root }}
        run: |
          set -euo pipefail
          CODE=$(python3 -c 'import json; print(json.load(open("version.json"))["versionCode"])')
          NAME=$(python3 -c 'import json; print(json.load(open("version.json"))["versionName"])')
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          python3 << 'PY'
          from pathlib import Path
          import re, json
          v = json.load(open("version.json", encoding="utf-8"))
          code, name = int(v["versionCode"]), str(v["versionName"])
          g = Path("app/build.gradle.kts")
          t = g.read_text(encoding="utf-8")
          t = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {code}", t)
          t = re.sub(r'versionName\s*=\s*"[^"]*"', f'versionName = "{name}"', t)
          g.write_text(t, encoding="utf-8")
          Path("app/src/main/assets").mkdir(parents=True, exist_ok=True)
          Path("app/src/main/assets/version.json").write_text(
              json.dumps(v, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print(f"Synced versionCode={code} versionName={name}")
          PY

      - name: gradlew exécutable
        working-directory: ${{ steps.root.outputs.project_root }}
        run: chmod +x ./gradlew

      - name: Compile Debug
        working-directory: ${{ steps.root.outputs.project_root }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SBhStudio-debug-${{ env.VERSION_NAME }}
          path: ${{ steps.root.outputs.project_root }}/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  release:
    name: Signed Release APK
    needs: analyze-and-debug
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Localiser la racine Gradle (studio)
        id: root
        run: |
          set -euo pipefail
          if [ -f gradlew ] && [ -f settings.gradle.kts ]; then
            echo "project_root=." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FOUND=$(find . -name gradlew -type f 2>/dev/null | head -1 || true)
          test -n "$FOUND" || { echo "gradlew introuvable"; exit 1; }
          echo "project_root=$(dirname "$FOUND")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync version.json → Gradle + assets
        working-directory: ${{ steps.root.outputs.project_root }}
        run: |
          set -euo pipefail
          CODE=$(python3 -c 'import json; print(json.load(open("version.json"))["versionCode"])')
          NAME=$(python3 -c 'import json; print(json.load(open("version.json"))["versionName"])')
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          python3 << 'PY'
          from pathlib import Path
          import re, json
          v = json.load(open("version.json", encoding="utf-8"))
          code, name = int(v["versionCode"]), str(v["versionName"])
          g = Path("app/build.gradle.kts")
          t = g.read_text(encoding="utf-8")
          t = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {code}", t)
          t = re.sub(r'versionName\s*=\s*"[^"]*"', f'versionName = "{name}"', t)
          g.write_text(t, encoding="utf-8")
          Path("app/src/main/assets").mkdir(parents=True, exist_ok=True)
          Path("app/src/main/assets/version.json").write_text(
              json.dumps(v, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          PY

      - name: gradlew exécutable
        working-directory: ${{ steps.root.outputs.project_root }}
        run: chmod +x ./gradlew

      - name: Vérifier secrets de signature
        id: secrets
        env:
          SBH_KEYSTORE_B64: ${{ secrets.SBH_KEYSTORE_B64 }}
          SBH_KEYSTORE_PASSWORD: ${{ secrets.SBH_KEYSTORE_PASSWORD }}
          SBH_KEY_ALIAS: ${{ secrets.SBH_KEY_ALIAS }}
          SBH_KEY_PASSWORD: ${{ secrets.SBH_KEY_PASSWORD }}
        run: |
          if [ -n "\( {SBH_KEYSTORE_B64:-}" ] && [ -n " \){SBH_KEYSTORE_PASSWORD:-}" ] && [ -n "\( {SBH_KEY_ALIAS:-}" ] && [ -n " \){SBH_KEY_PASSWORD:-}" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets de signature absents — release signée ignorée."
          fi

      - name: Préparer le keystore
        if: steps.secrets.outputs.has_signing == 'true'
        env:
          SBH_KEYSTORE_B64: ${{ secrets.SBH_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          echo "$SBH_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/sbh-release.keystore"
          echo "SBH_KEYSTORE_PATH=$RUNNER_TEMP/sbh-release.keystore" >> "$GITHUB_ENV"

      - name: Build Release signée
        if: steps.secrets.outputs.has_signing == 'true'
        working-directory: ${{ steps.root.outputs.project_root }}
        env:
          SBH_KEYSTORE_PASSWORD: ${{ secrets.SBH_KEYSTORE_PASSWORD }}
          SBH_KEY_ALIAS: ${{ secrets.SBH_KEY_ALIAS }}
          SBH_KEY_PASSWORD: ${{ secrets.SBH_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Release APK
        if: steps.secrets.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SBhStudio-release-${{ env.VERSION_NAME }}
          path: ${{ steps.root.outputs.project_root }}/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Préparer fichiers de release
        if: steps.secrets.outputs.has_signing == 'true'
        working-directory: ${{ steps.root.outputs.project_root }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "\( GITHUB_WORKSPACE/SBhStudio- \){VERSION_NAME}.apk"
          cp version.json "\( GITHUB_WORKSPACE/version- \){VERSION_NAME}.json"
          SHA256=$(sha256sum "\( GITHUB_WORKSPACE/SBhStudio- \){VERSION_NAME}.apk" | awk '{print $1}')
          echo "APK_SHA256=$SHA256" >> "$GITHUB_ENV"
          python3 << PY
          import json, os
          v = json.load(open("version.json", encoding="utf-8"))
          v["sha256"] = os.environ["APK_SHA256"]
          v["apkUrl"] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{os.environ['VERSION_NAME']}/SBhStudio-{os.environ['VERSION_NAME']}.apk"
          open(os.environ["GITHUB_WORKSPACE"] + "/release-body.json", "w", encoding="utf-8").write(
              json.dumps(v, ensure_ascii=False, indent=2) + "\n"
          )
          PY

      - name: Publier GitHub Release
        if: |
          steps.secrets.outputs.has_signing == 'true' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: SBh Studio v${{ env.VERSION_NAME }}
          body_path: release-body.json
          files: |
            SBhStudio-${{ env.VERSION_NAME }}.apk
            version-${{ env.VERSION_NAME }}.json
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
