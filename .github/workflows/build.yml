name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract project ZIP
      run: |
        unzip -o SBhStudio_ready.zip -d temp_extract
        # Déplace tout le contenu du sous-dossier vers la racine si nécessaire
        if [ -d "temp_extract/SBhStudio_ready" ]; then
          mv temp_extract/SBhStudio_ready/* .
        else
          mv temp_extract/* .
        fi
        rm -rf temp_extract
        chmod +x gradlew || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
