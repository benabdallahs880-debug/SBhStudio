name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          ZIP_PATH="./SBhStudio_v1.0_communication_core.zip"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "ERREUR : archive introuvable : $ZIP_PATH"
            echo "Archives disponibles :"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "========================================"
          echo "SBh Studio V1.0"
          echo "Archive : $ZIP_PATH"
          echo "========================================"

          rm -rf temp_extract
          mkdir -p temp_extract

          unzip -q -o "$ZIP_PATH" -d temp_extract

          GRADLEW_PATH=$(find temp_extract -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERREUR : gradlew introuvable dans l'archive."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Projet Android trouvé : $PROJECT_DIR"

          # ============================================================
          # PACK GENERATOR
          # ============================================================

          GENERATOR="$PROJECT_DIR/app/src/main/java/com/sbh/studio/generator/PackGenerator.kt"

          if [ ! -f "$GENERATOR" ]; then
            echo "ERREUR : PackGenerator.kt introuvable."
            exit 1
          fi

          echo "=== Vérification PackGenerator ==="

          grep -q "fun textureKey" "$GENERATOR"
          grep -q "fun safe" "$GENERATOR"
          grep -q "fun splitId" "$GENERATOR"
          grep -q "fun blockJson" "$GENERATOR"
          grep -q "MAX_TEXTURE" "$GENERATOR"

          echo "PackGenerator détecté."

          # ============================================================
          # FACTIONS
          # ============================================================

          FACTIONS_JSON="$PROJECT_DIR/app/src/main/assets/agw/factions.json"

          if [ ! -f "$FACTIONS_JSON" ]; then
            echo "ERREUR : factions.json introuvable."
            exit 1
          fi

          echo "Factions détectées."

          # ============================================================
          # MAP STUDIO
          # ============================================================

          MAP_STUDIO="$PROJECT_DIR/app/src/main/assets/mapstudio.html"

          if [ ! -f "$MAP_STUDIO" ]; then
            echo "ERREUR : mapstudio.html introuvable."
            exit 1
          fi

          grep -q "codePreview" "$MAP_STUDIO"
          grep -q "btnCodePreview" "$MAP_STUDIO"
          grep -q "renderCodePreview" "$MAP_STUDIO"

          echo "Map Studio détecté."

          # ============================================================
          # COMMUNICATION CORE V1.0
          # ============================================================

          COMMUNICATION_DIR="$PROJECT_DIR/app/src/main/java/com/sbh/studio/communication"

          if [ ! -d "$COMMUNICATION_DIR" ]; then
            echo "ERREUR : dossier communication introuvable."
            exit 1
          fi

          echo "=== Vérification Communication Core ==="

          REQUIRED_FILES=(
            "SBhModels.kt"
            "SBhCommunicationCore.kt"
            "SBhValidationEngine.kt"
            "SBhProtocol.kt"
            "SBhTransmitter.kt"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$COMMUNICATION_DIR/$FILE" ]; then
              echo "ERREUR : fichier manquant : $FILE"
              exit 1
            fi

            echo "OK : $FILE"
          done

          # ============================================================
          # REPORTS UI
          # ============================================================

          REPORTS_SCREEN="$PROJECT_DIR/app/src/main/java/com/sbh/studio/ui/ReportsScreen.kt"

          if [ ! -f "$REPORTS_SCREEN" ]; then
            echo "ERREUR : ReportsScreen.kt introuvable."
            exit 1
          fi

          echo "ReportsScreen détecté."

          # ============================================================
          # VERIFICATION MAIN ACTIVITY
          # ============================================================

          MAIN_ACTIVITY="$PROJECT_DIR/app/src/main/java/com/sbh/studio/MainActivity.kt"

          if [ ! -f "$MAIN_ACTIVITY" ]; then
            echo "ERREUR : MainActivity.kt introuvable."
            exit 1
          fi

          grep -q "SBhTransmitter" "$MAIN_ACTIVITY" || {
            echo "ERREUR : SBhTransmitter non intégré à MainActivity."
            exit 1
          }

          echo "Transmission SBh détectée dans MainActivity."

          # ============================================================
          # VERIFICATION ADVANCED PACK ENGINE
          # ============================================================

          ADVANCED_ENGINE="$PROJECT_DIR/app/src/main/java/com/sbh/studio/generator/AdvancedPackEngine.kt"

          if [ ! -f "$ADVANCED_ENGINE" ]; then
            echo "ERREUR : AdvancedPackEngine.kt introuvable."
            exit 1
          fi

          grep -q "SBhValidationEngine" "$ADVANCED_ENGINE" || {
            echo "ERREUR : SBhValidationEngine non intégré."
            exit 1
          }

          grep -q "protocol.json" "$ADVANCED_ENGINE" || {
            echo "ERREUR : protocol.json non généré par AdvancedPackEngine."
            exit 1
          }

          echo "Validation + protocole SBh détectés."

          # ============================================================
          # VERSION DU PROJET
          # ============================================================

          echo "=== Recherche version SBh Studio ==="

          VERSION_FILES=$(find "$PROJECT_DIR" \
            -type f \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle.properties" \
              -o -name "*.kt" \
            \) -print)

          echo "$VERSION_FILES" | while read -r FILE; do
            grep -Hn "1.0.0\|versionCode.*28" "$FILE" 2>/dev/null || true
          done

          echo "Vérification structurelle terminée."

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          echo "=== Nettoyage ==="
          ./gradlew clean

          echo "=== Compilation APK ==="
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=== APK générés ==="

          find "${PROJECT_DIR}/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SBhStudio-V1.0-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
