name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          ZIP_PATH="./SBhStudio_v0.8.5_buildfix.zip"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "ERREUR : archive SBh Studio V0.8.5 introuvable : $ZIP_PATH"
            echo "=== Archives disponibles ==="
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Archive utilisée : $ZIP_PATH"

          rm -rf temp_extract
          mkdir -p temp_extract

          unzip -q -o "$ZIP_PATH" -d temp_extract

          GRADLEW_PATH=$(find temp_extract -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERREUR : gradlew introuvable dans l'archive."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Projet Android trouvé : $PROJECT_DIR"

          GENERATOR="$PROJECT_DIR/app/src/main/java/com/sbh/studio/generator/PackGenerator.kt"

          if [ ! -f "$GENERATOR" ]; then
            echo "ERREUR : PackGenerator.kt introuvable."
            exit 1
          fi

          echo "=== Vérification PackGenerator ==="

          grep -q "fun textureKey" "$GENERATOR" || {
            echo "ERREUR : textureKey manquant"
            exit 1
          }

          grep -q "fun safe" "$GENERATOR" || {
            echo "ERREUR : safe manquant"
            exit 1
          }

          grep -q "fun splitId" "$GENERATOR" || {
            echo "ERREUR : splitId manquant"
            exit 1
          }

          grep -q "fun blockJson" "$GENERATOR" || {
            echo "ERREUR : blockJson manquant"
            exit 1
          }

          grep -q "MAX_TEXTURE" "$GENERATOR" || {
            echo "ERREUR : MAX_TEXTURE manquant"
            exit 1
          }

          echo "PackGenerator corrigé détecté."

          echo "=== Vérification Map Studio ==="

          MAP_STUDIO="$PROJECT_DIR/app/src/main/assets/mapstudio.html"

          if [ ! -f "$MAP_STUDIO" ]; then
            echo "ERREUR : mapstudio.html introuvable."
            exit 1
          fi

          grep -q "codePreview" "$MAP_STUDIO" || {
            echo "ERREUR : aperçu Map Code manquant"
            exit 1
          }

          grep -q "btnCodePreview" "$MAP_STUDIO" || {
            echo "ERREUR : bouton aperçu Map Code manquant"
            exit 1
          }

          grep -q "renderCodePreview" "$MAP_STUDIO" || {
            echo "ERREUR : fonction renderCodePreview manquante"
            exit 1
          }

          echo "Map Code + aperçu détectés."

          echo "=== Vérification Portal Studio ==="

          grep -R -q "Portal Code" \
            "$PROJECT_DIR/app/src/main" \
            "$PROJECT_DIR/app/src/main/assets" || {
              echo "AVERTISSEMENT : texte Portal Code non trouvé."
            }

          echo "=== Vérification connexion Map ↔ Portail ==="

          grep -R -q "portal.map" \
            "$PROJECT_DIR/app/src/main" \
            "$PROJECT_DIR/app/src/main/assets" || {
              echo "AVERTISSEMENT : liaison portal.map non détectée."
            }

          echo "=== Projet SBh Studio V0.8.5 prêt ==="

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Projet utilisé : $PROJECT_DIR"

          echo "=== Gradle ==="
          ./gradlew --version

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Compilation SBh Studio V0.8.5 ==="

          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "=== APK générés ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SBhStudio-V0.8.5-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
