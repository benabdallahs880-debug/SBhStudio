name: SBH Studio V1.4

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbh-studio-v1.4-${{ github.ref }}
  cancel-in-progress: true

env:
  SBH_ARCHIVE: SBhStudio_v1.4_sbh_world_agw_integration.zip

jobs:

  # ============================================================
  # INSPECTION
  # ============================================================

  inspect:
    name: Inspect SBH Studio V1.4
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Vérifier l'archive
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "       SBH STUDIO V1.4"
          echo "       ARCHIVE CHECK"
          echo "=============================================="

          test -f "$SBH_ARCHIVE"

          echo "Archive trouvée :"
          echo "$SBH_ARCHIVE"


      - name: Extraire le projet
        shell: bash
        run: |
          set -euo pipefail

          rm -rf sbhstudio-src

          mkdir -p sbhstudio-src

          unzip -q "$SBH_ARCHIVE" -d sbhstudio-src

          echo "Archive extraite."


      - name: Détecter le projet Gradle
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=$(find sbhstudio-src \
            -type f \
            -name "gradlew" \
            -print \
            -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then

            PROJECT_DIR=$(find sbhstudio-src \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              -quit | xargs -r dirname)

          fi

          if [ -z "$PROJECT_DIR" ]; then

            echo "ERREUR : projet Gradle introuvable."

            find sbhstudio-src \
              -type f \
              \( \
                -name "*.gradle" \
                -o \
                -name "*.gradle.kts" \
                -o \
                -name "gradlew" \
              \) \
              -print || true

            exit 1

          fi

          echo "Projet détecté :"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$PROJECT_DIR/gradlew"


      - name: Vérifier Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew --version


      - name: Vérifier AGW World Core
        shell: bash
        run: |
          echo "=============================================="
          echo "       AGW WORLD CORE"
          echo "=============================================="

          find sbhstudio-src \
            -type f \
            \( \
              -iname "agw_world_core.json" \
              -o \
              -iname "*agw*world*core*.json" \
              -o \
              -iname "*worldcore*.json" \
            \) \
            -print || true


  # ============================================================
  # BUILD
  # ============================================================

  build:
    name: Build SBH Studio V1.4
    runs-on: ubuntu-latest

    needs:
      - inspect

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Vérifier archive
        shell: bash
        run: |
          set -euo pipefail

          test -f "$SBH_ARCHIVE"


      - name: Extraire SBH Studio V1.4
        shell: bash
        run: |
          set -euo pipefail

          rm -rf sbhstudio-src

          mkdir -p sbhstudio-src

          unzip -q "$SBH_ARCHIVE" -d sbhstudio-src


      - name: Détecter le projet Gradle
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=$(find sbhstudio-src \
            -type f \
            -name "gradlew" \
            -print \
            -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then

            PROJECT_DIR=$(find sbhstudio-src \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print \
              -quit | xargs -r dirname)

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : projet Gradle introuvable."
            exit 1
          fi

          echo "Projet : $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$PROJECT_DIR/gradlew"


      # ========================================================
      # JAVA
      # ========================================================

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ========================================================
      # ANDROID
      # ========================================================

      - name: Préparer Android SDK
        uses: android-actions/setup-android@v3


      - name: Vérifier Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "       ANDROID SDK"
          echo "=============================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "SDKMANAGER :"

          command -v sdkmanager || true

          echo ""
          echo "SDK DIRECTORIES :"

          ls -la "$ANDROID_HOME" || true

          echo ""
          echo "PLATFORMS :"

          ls -la "$ANDROID_HOME/platforms" || true

          echo ""
          echo "BUILD TOOLS :"

          ls -la "$ANDROID_HOME/build-tools" || true


      # ========================================================
      # INSTALLATION ANDROID ROBUSTE
      # ========================================================

      - name: Installer les composants Android nécessaires
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then

            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print \
              -quit)

          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then

            echo "ERREUR : sdkmanager introuvable."

            find "$ANDROID_HOME" \
              -type f \
              -name sdkmanager \
              -print || true

            exit 1

          fi

          echo "sdkmanager utilisé :"
          echo "$SDKMANAGER"

          echo ""
          echo "===== LICENCES ====="

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo ""
          echo "===== PLATFORM TOOLS ====="

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools"

          echo ""
          echo "===== ANDROID 34 ====="

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-34"

          echo ""
          echo "===== ANDROID 35 ====="

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-35"

          echo ""
          echo "===== BUILD TOOLS 34 ====="

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "build-tools;34.0.0"

          echo ""
          echo "===== BUILD TOOLS 35 ====="

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "build-tools;35.0.0"


      # ========================================================
      # GRADLE
      # ========================================================

      - name: Vérifier Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew --version


      # ========================================================
      # JSON
      # ========================================================

      - name: Valider les fichiers JSON
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PY'

          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])

          files = list(root.rglob("*.json"))

          errors = 0

          print("==============================================")
          print("       VALIDATION JSON")
          print("==============================================")

          print(f"JSON trouvés : {len(files)}")

          for path in files:

              try:

                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as f:

                      json.load(f)

              except Exception as exc:

                  print()
                  print("JSON INVALID")
                  print(path)
                  print(exc)

                  errors += 1

          print()
          print(f"JSON analysés : {len(files)}")

          if errors:
              print(f"Erreurs JSON : {errors}")
              sys.exit(1)

          print("Tous les JSON sont valides.")

          PY


      # ========================================================
      # CLEAN
      # ========================================================

      - name: Gradle Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --stacktrace \
            --no-daemon


      # ========================================================
      # BUILD
      # ========================================================

      - name: Compiler SBH Studio V1.4
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "       BUILD SBH STUDIO V1.4"
          echo "=============================================="

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon


      # ========================================================
      # TESTS
      # ========================================================

      - name: Tests Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew test \
            --stacktrace \
            --no-daemon \
            --continue


      # ========================================================
      # APK
      # ========================================================

      - name: Trouver l'APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "       APK"
          echo "=============================================="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*debug*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then

            APK=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print \
              -quit)

          fi

          if [ -z "$APK" ]; then

            echo "ERREUR : aucun APK généré."

            exit 1

          fi

          echo "APK trouvé : $APK"

          mkdir -p artifacts

          cp "$APK" \
            "artifacts/SBH_Studio_V1.4_debug.apk"

          ls -lh \
            "artifacts/SBH_Studio_V1.4_debug.apk"


      # ========================================================
      # ARTIFACT
      # ========================================================

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: SBH-Studio-V1.4-Android
          path: artifacts/SBH_Studio_V1.4_debug.apk
          if-no-files-found: error


      # ========================================================
      # FIN
      # ========================================================

      - name: Rapport final
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "       SBH STUDIO V1.4"
          echo "       BUILD TERMINE"
          echo "=============================================="
          echo ""
          echo "Archive : $SBH_ARCHIVE"
          echo ""
          echo "SBH Studio + SBH World + AGW World Core"
          echo ""
          echo "APK : SBH_Studio_V1.4_debug.apk"
          echo ""
          echo "Artifact : SBH-Studio-V1.4-Android"
          echo ""
          echo "=============================================="
