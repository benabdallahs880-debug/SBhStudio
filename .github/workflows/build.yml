name: Build SBh Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build SBh Studio
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. RÉCUPÉRER LE DÉPÔT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. TROUVER ET EXTRAIRE SBH STUDIO
      # ============================================================
      - name: Extraire le projet SBh Studio
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " RECHERCHE DU PROJET SBH STUDIO"
          echo "=========================================="

          ZIP=""

          # Chercher le ZIP principal SBh Studio
          ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname 'SBhStudio*.zip' \
            -print \
            | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "❌ Aucun ZIP SBh Studio trouvé."

            echo ""
            echo "===== FICHIERS DU DÉPÔT ====="

            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -type f \
              -print \
              | sort \
              | head -n 1000

            exit 1
          fi

          echo "✅ Archive trouvée :"
          echo "$ZIP"

          BUILD_DIR="$GITHUB_WORKSPACE/.sbh-build"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          echo ""
          echo "Extraction..."

          unzip -q "$ZIP" -d "$BUILD_DIR"

          echo "✅ Archive extraite."

          echo ""
          echo "===== CONTENU EXTRAIT ====="

          find "$BUILD_DIR" \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -n 1000

          # --------------------------------------------------------
          # Trouver le gradlew réel à l'intérieur de l'archive
          # --------------------------------------------------------

          GRADLEW="$(find "$BUILD_DIR" \
            -type f \
            -name gradlew \
            -print \
            -quit)"

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "❌ gradlew introuvable après extraction."

            echo ""
            echo "===== ARBORESCENCE COMPLÈTE ====="

            find "$BUILD_DIR" \
              -maxdepth 8 \
              -print \
              | sort \
              | head -n 2000

            exit 1
          fi

          ROOT="$(dirname "$GRADLEW")"

          echo ""
          echo "=========================================="
          echo " PROJET ANDROID TROUVÉ"
          echo "=========================================="
          echo "$ROOT"

          if [ ! -f "$ROOT/gradlew" ]; then
            echo "❌ gradlew absent."
            exit 1
          fi

          if [ ! -f "$ROOT/settings.gradle" ] &&
             [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "⚠️ settings.gradle(.kts) absent."
          fi

          if [ ! -d "$ROOT/app" ]; then
            echo "❌ Dossier app/ absent."
            exit 1
          fi

          chmod +x "$ROOT/gradlew"

          echo ""
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. DIAGNOSTIC STRUCTURE
      # ============================================================
      - name: Diagnostiquer le projet
        working-directory: ${{ steps.extract.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " STRUCTURE SBH STUDIO"
          echo "=========================================="

          echo ""
          echo "Projet :"
          pwd

          echo ""
          echo "Fichiers Gradle :"

          find . \
            -maxdepth 5 \
            \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "gradle-wrapper.properties" \
            \
            -print \
            | sort

          echo ""
          echo "Wrapper :"

          ls -lh gradlew

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================
      - name: Préparer Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "❌ sdkmanager introuvable ou non exécutable."
            exit 1
          fi

          echo ""
          echo "Version sdkmanager :"

          "$SDKMANAGER" --version

          echo ""
          echo "Acceptation des licences..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo ""
          echo "Installation SDK..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "✅ Android SDK prêt."

      # ============================================================
      # 6. VERSION SBH STUDIO
      # ============================================================
      - name: Vérifier version.json
        id: version
        working-directory: ${{ steps.extract.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "version.json" ]; then
            echo "❌ version.json absent."

            echo ""
            echo "Recherche de version.json :"

            find . \
              -name "version.json" \
              -print

            exit 1
          fi

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("version.json")

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          if "versionName" not in data:
              raise SystemExit(
                  "❌ versionName absent de version.json"
              )

          if "versionCode" not in data:
              raise SystemExit(
                  "❌ versionCode absent de version.json"
              )

          version_name = str(
              data["versionName"]
          )

          version_code = int(
              data["versionCode"]
          )

          print(
              f"Version SBh Studio : {version_name}"
          )

          print(
              f"Version Code      : {version_code}"
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write(
                  f"version={version_name}\n"
              )

              f.write(
                  f"code={version_code}\n"
              )
          PY

      # ============================================================
      # 7. CORRECTION build.gradle.kts
      # ============================================================
      - name: Vérifier et corriger build.gradle.kts
        working-directory: ${{ steps.extract.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "❌ $FILE introuvable."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/build.gradle.kts"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          if not re.search(
              r'(?m)^android\s*\{',
              text
          ):
              raise SystemExit(
                  "❌ Bloc android { introuvable."
              )

          patterns = [
              r'(?ms)^[ \t]*val\s+sbhVersionText\s*=.*?(?=^[ \t]*(?:val\s+|android\s*\{)|\Z)',
              r'(?ms)^[ \t]*val\s+sbhVersionCode\s*=.*?(?=^[ \t]*(?:val\s+|android\s*\{)|\Z)',
              r'(?ms)^[ \t]*val\s+sbhVersionName\s*=.*?(?=^[ \t]*(?:val\s+|android\s*\{)|\Z)',
          ]

          for pattern in patterns:
              text = re.sub(
                  pattern,
                  "",
                  text
              )

          match = re.search(
              r'(?m)^android\s*\{',
              text
          )

          if not match:
              raise SystemExit(
                  "❌ android { introuvable."
              )

          block = r'''
          val sbhVersionText = file("../version.json").readText()

          val sbhVersionCode: Int =
              Regex("""["]versionCode["]\s*:\s*(\d+)""")
                  .find(sbhVersionText)
                  ?.groupValues
                  ?.get(1)
                  ?.toInt()
                  ?: error("version.json: versionCode manquant")

          val sbhVersionName: String =
              Regex
